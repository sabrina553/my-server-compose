services:
  <NAME>:
    container_name: <NAME>
    image: 
    restart: unless-stopped
    #profiles: 
    #extends:
    #command: 
    #deploy:
    # Baseline hardening. Don't add apparmor:unconfined; it disables Docker's
    # default AppArmor profile. Add back only the capabilities the image needs:
    #   starts as root, chowns, then drops to a user -> CHOWN DAC_READ_SEARCH FOWNER SETGID SETUID
    #   runs as non-root throughout                  -> usually none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    #cap_add:
    #read_only: true   # try it; many images need extra tmpfs mounts first
    tmpfs:
      - /tmp:rw,noexec,nosuid
    depends_on:
      traefik:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    #env:
    #secrets:
    environment:
    #ports:
    networks:
      - external
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.<NAME>-https.rule=Host(`<NAME>.${DOMAINNAME}`)"
      - "traefik.http.services.<NAME>.loadbalancer.server.port=<PORT>"      
      - "deunhealth.restart.on.unhealthy=true"
    volumes:
      - ${VOLDIR}/<NAME>:/config
    #devices:
    healthcheck: 
