
# ============================== NETWORKS ==============================
networks:
  socket_proxy: # deunhealth -> restart-capable proxy
    name: socket_proxy
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24
  socket_proxy_ro: # Traefik, Dozzle, Diun -> allowlisted read-only proxy
    name: socket_proxy_ro
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.1.0/24
  external: # internet, and Traefik's default route to apps
    name: "external"
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    enable_ipv4: true
    enable_ipv6: true
  # Backend networks: no internet access, and each one holds only a backend and
  # the services that actually use it, so a compromised app can't reach every
  # database. Traefik routes over `external` by default (see traefik.yaml).
  db_postgres:
    name: db_postgres
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.2.0/24
  immich_backend: # immich-server, redis, machine learning
    name: immich_backend
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.3.0/24
  ghost_backend:
    name: ghost_backend
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.4.0/24
  leantime_backend:
    name: leantime_backend
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.5.0/24
  grimmory_backend:
    name: grimmory_backend
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.6.0/24
  authelia_backend: # authelia, authelia-redis (session store)
    name: authelia_backend
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.8.0/24
  # Traefik <-> FileBrowser only. FileBrowser trusts Authelia's Remote-User
  # header, which is only safe while nothing but Traefik can reach it.
  filebrowser_proxy:
    name: filebrowser_proxy
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.9.0/24
  # Prowlarr and Chaptarr skip their own login (Auth Method: External) and rely
  # on Authelia. Their UIs listen only on their fixed address here, and this
  # network holds just them and Traefik. Not internal: they need the internet.
  arr:
    name: arr
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.10.0/24
  # Outgoing links only (the *arr UIs aren't bound on these). One per *arr: if
  # the two shared a second network, Docker DNS could resolve one to an address
  # where its UI isn't bound.
  chaptarr_downloads: # chaptarr -> qBittorrent (vpn:8080)
    name: chaptarr_downloads
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.11.0/24
  prowlarr_downloads: # prowlarr -> qBittorrent (vpn:8080)
    name: prowlarr_downloads
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.13.0/24
  prowlarr_flaresolverr: # prowlarr -> flaresolverr:8191
    name: prowlarr_flaresolverr
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.12.0/24
  # Gluetun (vpn) is NOT on `external`: its namespace (qBittorrent, Mousetrap
  # with no login) would be reachable by every app there. It has its own way
  # out, and only the containers that need it can reach it.
  vpn_egress: # vpn only: the WireGuard tunnel's way out
    name: vpn_egress
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.16.0/24
  vpn_ui: # Traefik (fixed .249) -> qBittorrent and Mousetrap UIs
    name: vpn_ui
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.17.0/24
  # FlareSolverr -> Gluetun's HTTP proxy (vpn:8888). FlareSolverr has no other
  # way out, so all its traffic goes through the tunnel.
  vpn_proxy:
    name: vpn_proxy
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.14.0/24
  lldap_backend: # authelia -> LDAP, which listens on lldap's fixed .10 here only
    name: lldap_backend
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.15.0/24
  # For Traefik to reach routed services that have no internet access
  # (CouchDB, pgAdmin, Dozzle). Those carry traefik.docker.network=proxy_internal.
  proxy_internal:
    name: proxy_internal
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.7.0/24

# ============================== SECRETS ===============================
# Docker secret <app>_<item> is always the file secrets/<app>/<item>.
secrets:
  # --- Shared and core
  smtp_password:
    file: $DOCKERDIR/secrets/smtp/password
  traefik_cloudflare_dns_api_token:
    file: $DOCKERDIR/secrets/traefik/cloudflare_dns_api_token
  cloudflared_tunnel_token:
    file: $DOCKERDIR/secrets/cloudflared/tunnel_token
  postgres_password:
    file: $DOCKERDIR/secrets/postgres/password
  # --- Authelia
  authelia_jwt_secret:
    file: $DOCKERDIR/secrets/authelia/jwt_secret
  authelia_session_secret:
    file: $DOCKERDIR/secrets/authelia/session_secret
  authelia_db_password:
    file: $DOCKERDIR/secrets/authelia/db_password
  authelia_storage_encryption_key:
    file: $DOCKERDIR/secrets/authelia/storage_encryption_key
  authelia_oidc_hmac_secret:
    file: $DOCKERDIR/secrets/authelia/oidc_hmac_secret
  authelia_oidc_jwks_key:
    file: $DOCKERDIR/secrets/authelia/oidc_jwks_key
  # Password for the dedicated 'authelia' LDAP bind user in LLDAP.
  authelia_ldap_password:
    file: $DOCKERDIR/secrets/authelia/ldap_password
  # Valkey session store (authelia-redis); Authelia and Valkey both read it.
  authelia_redis_password:
    file: $DOCKERDIR/secrets/authelia/redis_password
  # OIDC client secret digests (PBKDF2), generated by
  # scripts/authelia-hash-oidc-secrets.sh from each app's plaintext secret.
  authelia_oidc_filebrowser_digest:
    file: $DOCKERDIR/secrets/authelia/oidc_filebrowser_digest
  authelia_oidc_freshrss_digest:
    file: $DOCKERDIR/secrets/authelia/oidc_freshrss_digest
  authelia_oidc_grimmory_digest:
    file: $DOCKERDIR/secrets/authelia/oidc_grimmory_digest
  authelia_oidc_homeassistant_digest:
    file: $DOCKERDIR/secrets/authelia/oidc_homeassistant_digest
  authelia_oidc_immich_digest:
    file: $DOCKERDIR/secrets/authelia/oidc_immich_digest
  authelia_oidc_leantime_digest:
    file: $DOCKERDIR/secrets/authelia/oidc_leantime_digest
  authelia_oidc_linkwarden_digest:
    file: $DOCKERDIR/secrets/authelia/oidc_linkwarden_digest
  authelia_oidc_mealie_digest:
    file: $DOCKERDIR/secrets/authelia/oidc_mealie_digest
  authelia_oidc_vaultwarden_digest:
    file: $DOCKERDIR/secrets/authelia/oidc_vaultwarden_digest
  # --- Chaptarr
  chaptarr_db_password:
    file: $DOCKERDIR/secrets/chaptarr/db_password
  # --- FileBrowser
  filebrowser_oidc_client_id:
    file: $DOCKERDIR/secrets/filebrowser/oidc_client_id
  filebrowser_oidc_client_secret:
    file: $DOCKERDIR/secrets/filebrowser/oidc_client_secret
  # --- FreshRSS
  freshrss_oidc_client_id:
    file: $DOCKERDIR/secrets/freshrss/oidc_client_id
  freshrss_oidc_client_secret:
    file: $DOCKERDIR/secrets/freshrss/oidc_client_secret
  freshrss_db_password:
    file: $DOCKERDIR/secrets/freshrss/db_password
  freshrss_oidc_crypto_key:
    file: $DOCKERDIR/secrets/freshrss/oidc_crypto_key
  # --- Ghost
  ghost_db_root_password:
    file: $DOCKERDIR/secrets/ghost/db_root_password
  ghost_db_password:
    file: $DOCKERDIR/secrets/ghost/db_password
  # --- Grimmory
  grimmory_db_password:
    file: $DOCKERDIR/secrets/grimmory/db_password
  grimmory_db_root_password:
    file: $DOCKERDIR/secrets/grimmory/db_root_password
  grimmory_oidc_client_id:
    file: $DOCKERDIR/secrets/grimmory/oidc_client_id
  # --- Leantime
  leantime_oidc_client_id:
    file: $DOCKERDIR/secrets/leantime/oidc_client_id
  leantime_oidc_client_secret:
    file: $DOCKERDIR/secrets/leantime/oidc_client_secret
  leantime_db_root_password:
    file: $DOCKERDIR/secrets/leantime/db_root_password
  # Also the app's LEAN_DB_PASSWORD (same user).
  leantime_db_password:
    file: $DOCKERDIR/secrets/leantime/db_password
  leantime_session_secret:
    file: $DOCKERDIR/secrets/leantime/session_secret
  # --- Home Assistant
  homeassistant_oidc_client_id:
    file: $DOCKERDIR/secrets/homeassistant/oidc_client_id
  homeassistant_oidc_client_secret:
    file: $DOCKERDIR/secrets/homeassistant/oidc_client_secret
  # --- Immich
  immich_oidc_client_id:
    file: $DOCKERDIR/secrets/immich/oidc_client_id
  immich_db_password:
    file: $DOCKERDIR/secrets/immich/db_password
  # --- Linkwarden
  linkwarden_oidc_client_id:
    file: $DOCKERDIR/secrets/linkwarden/oidc_client_id
  linkwarden_oidc_client_secret:
    file: $DOCKERDIR/secrets/linkwarden/oidc_client_secret
  # Full postgresql:// URL including the password (Linkwarden only takes a URL).
  linkwarden_db_url:
    file: $DOCKERDIR/secrets/linkwarden/db_url
  linkwarden_nextauth_secret:
    file: $DOCKERDIR/secrets/linkwarden/nextauth_secret
  # --- LLDAP
  lldap_jwt_secret:
    file: $DOCKERDIR/secrets/lldap/jwt_secret
  lldap_key_seed:
    file: $DOCKERDIR/secrets/lldap/key_seed
  lldap_admin_password:
    file: $DOCKERDIR/secrets/lldap/admin_password
  lldap_db_url:
    file: $DOCKERDIR/secrets/lldap/db_url
  # --- Mealie
  mealie_oidc_client_id:
    file: $DOCKERDIR/secrets/mealie/oidc_client_id
  mealie_oidc_client_secret:
    file: $DOCKERDIR/secrets/mealie/oidc_client_secret
  mealie_db_password:
    file: $DOCKERDIR/secrets/mealie/db_password
  # --- Mousehole (disabled)
  mousehole_auth_password:
    file: $DOCKERDIR/secrets/mousehole/auth_password
  # --- Vaultwarden
  vaultwarden_db_url:
    file: $DOCKERDIR/secrets/vaultwarden/db_url
  vaultwarden_oidc_client_id:
    file: $DOCKERDIR/secrets/vaultwarden/oidc_client_id
  vaultwarden_oidc_client_secret:
    file: $DOCKERDIR/secrets/vaultwarden/oidc_client_secret
  vaultwarden_push_installation_id:
    file: $DOCKERDIR/secrets/vaultwarden/push_installation_id
  vaultwarden_push_installation_key:
    file: $DOCKERDIR/secrets/vaultwarden/push_installation_key
  vaultwarden_admin_token:
    file: $DOCKERDIR/secrets/vaultwarden/admin_token
  # --- VPN (Gluetun)
  vpn_wireguard_private_key:
    file: $DOCKERDIR/secrets/vpn/wireguard_private_key
  vpn_wireguard_preshared_key:
    file: $DOCKERDIR/secrets/vpn/wireguard_preshared_key
  vpn_wireguard_addresses:
    file: $DOCKERDIR/secrets/vpn/wireguard_addresses

# ============================== SERVICES ==============================
# A commented-out include is a disabled service.
include:
    # Core
    - compose/cloudflared/cloudflared.yaml
    - compose/traefik/traefik.yaml
    - compose/authelia/authelia.yaml
    - compose/authelia-redis/authelia-redis.yaml
    - compose/lldap/lldap.yaml
    - compose/vpn/gluetun.yaml
    - compose/dozzle/dozzle.yaml
    - compose/deunhealth/deunhealth.yaml
    - compose/diun/diun.yaml
    # - compose/watchtower/watchtower.yaml   # replaced by Diun (notify only)
    - compose/postgresql/postgresql.yaml
    - compose/pg-admin/pg-admin.yaml
    - compose/redis/redis.yaml
    - compose/socket-proxy/socket-proxy.yaml

    # Books and downloads
    # - compose/audiobookshelf/audiobookshelf.yaml
    - compose/grimmory/grimmory.yaml
    - compose/chaptarr/chaptarr.yaml
    - compose/prowlarr/prowlarr.yaml
    - compose/qbittorrent/qbittorrent.yaml
    # - compose/mousehole/mousehole.yaml
    - compose/mousetrap/mousetrap.yaml
    # - compose/bookkeep/bookkeep.yaml

    # Organisation
    - compose/mealie/mealie.yaml
    - compose/couch-db/couch-db.yaml
    - compose/linkwarden/linkwarden.yaml
    - compose/leantime/leantime.yaml

    # Personal data
    - compose/filebrowser/filebrowser.yaml
    - compose/immich/immich.yaml
    - compose/vaultwarden/vaultwarden.yaml
    - compose/home-assistant/home-assistant.yaml

    # Other
    - compose/irc/thelounge.yaml
    - compose/fresh-rss/fresh-rss.yaml
    - compose/crosswatch/crosswatch.yaml
    - compose/ghost/ghost.yaml