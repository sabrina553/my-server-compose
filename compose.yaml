
###########################NETWORKS###########################
networks:
  socket_proxy:
    name: socket_proxy
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24
  socket_proxy_ro:
    name: socket_proxy_ro
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.1.0/24
  external:
    name: "external"
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    enable_ipv4: true
    enable_ipv6: true
  # Backend networks: no internet access, and each one holds only a backend and
  # the services that actually use it, so a compromised app can't reach every
  # database. Traefik routes over `external` by default (see traefik.yaml).
  db_postgres:
    name: db_postgres
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.2.0/24
  immich_backend: # immich-server, redis, machine learning
    name: immich_backend
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.3.0/24
  ghost_backend:
    name: ghost_backend
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.4.0/24
  leantime_backend:
    name: leantime_backend
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.5.0/24
  grimmory_backend:
    name: grimmory_backend
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.6.0/24
  authelia_backend: # authelia, authelia-redis (session store)
    name: authelia_backend
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.8.0/24
  # Traefik <-> FileBrowser only. FileBrowser trusts Authelia's Remote-User
  # header, which is only safe while nothing but Traefik can reach it.
  filebrowser_proxy:
    name: filebrowser_proxy
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.9.0/24
  # For Traefik to reach routed services that have no internet access
  # (CouchDB, pgAdmin, Dozzle). Those carry traefik.docker.network=proxy_internal.
  proxy_internal:
    name: proxy_internal
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.7.0/24

###########################SECRETS###########################
secrets:
  smtp_password:
    file: $DOCKERDIR/secrets/smtp/password
  cf_dns_api_token:
    file: $DOCKERDIR/secrets/cloudflare/dns_api_token
  cf_tunnel_token:
    file: $DOCKERDIR/secrets/cloudflare/tunnel_token
  postgres_password:
    file: $DOCKERDIR/secrets/postgres/password

  #AUHELIA####################################################
  authelia_jwt:
    file: $DOCKERDIR/secrets/authelia/jwt
  authelia_secret_key:
    file: $DOCKERDIR/secrets/authelia/secret_key
  authelia_pg_password:
    file: $DOCKERDIR/secrets/authelia/pg_password
