    file: $DOCKERDIR/secrets/authelia/jwks
  # Password for the dedicated 'authelia' LDAP bind user in LLDAP.
  authelia_ldap_password:
    file: $DOCKERDIR/secrets/authelia/ldap_password
  # Valkey session store (authelia-redis); Authelia and Valkey both read it.
  authelia_redis_password:
    file: $DOCKERDIR/secrets/authelia/redis_password
  # OIDC client secret digests (PBKDF2), generated by
  # scripts/authelia-hash-oidc-secrets.sh from each app's plaintext secret.
