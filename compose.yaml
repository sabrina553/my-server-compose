    file: $DOCKERDIR/secrets/authelia/oidc/linkwarden
  authelia_oidc_mealie:
    file: $DOCKERDIR/secrets/authelia/oidc/mealie
  authelia_oidc_vaultwarden:
    file: $DOCKERDIR/secrets/authelia/oidc/vaultwarden
