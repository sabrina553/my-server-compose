## qBittorrent  https://github.com/linuxserver/docker-qbittorrent
## Torrent client inside the VPN's network namespace (all traffic through the
## tunnel). Web UI at <subdomain>.int.<domain>; its login is skipped only for
## Traefik's address on vpn_ui (Web UI > whitelisted subnets: 172.21.17.249/32,
## set in the app). Chaptarr and Prowlarr reach it at http://vpn:<webui port>.
services:
  qbittorrent:
    container_name: ${QBITTORRENT__NAME}
    image: ${QBITTORRENT__IMAGE}:${QBITTORRENT__VERSION}
    restart: unless-stopped

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:   # linuxserver init chowns its folders, then drops to PUID/PGID
    - CHOWN
    - SETGID
    - SETUID
    #read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      traefik:
        condition: service_started
        restart: false
      vpn:
        condition: service_healthy
        restart: true
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      WEBUI_PORT: ${QBITTORRENT__WEBUI_PORT}
      TORRENTING_PORT: ${TORRENTING_PORT}

    # service:, not container:, so Compose tracks the dependency. A recreated vpn
    # still leaves this in the old namespace; the healthcheck catches that.
    network_mode: "service:vpn"

    labels:
    - "traefik.enable=true"
    # Network: set on vpn (traefik.docker.network=vpn_ui), not here.
    - "traefik.http.routers.${QBITTORRENT__NAME}.rule=Host(`${QBITTORRENT__SUBDOMAIN}.int.${DOMAINNAME}`)"
    - "traefik.http.routers.${QBITTORRENT__NAME}.middlewares=authelia@docker"
    - "traefik.http.services.${QBITTORRENT__NAME}.loadbalancer.server.port=${QBITTORRENT__WEBUI_PORT}"
    - "deunhealth.restart.on.unhealthy=true"

    volumes:
    - ${VOLDIR}/${QBITTORRENT__NAME}:/config:rw
    - ${DATADIR}/torrents/downloads:/downloads:rw
    # Tails qBittorrent's log file to stdout for Dozzle. linuxserver requires
    # these to be root-owned and not world-writable.
    - ./custom-services.d:/custom-services.d:ro

    # Unhealthy when tun0 is gone (vpn recreated, this one only restarted).
    # A restart rejoins the dead namespace; use --force-recreate.
    healthcheck:
      test: ["CMD-SHELL", "test -e /sys/class/net/tun0 && curl -fso /dev/null http://localhost:${QBITTORRENT__WEBUI_PORT}/api/v2/app/version"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
