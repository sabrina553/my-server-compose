services:
  qbittorrent:
    container_name: qbittorrent
    image: ${QBITTORRENT__IMAGE}:${QBITTORRENT__VERSION}
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    #   - apparmor:unconfined
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    #read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid
    depends_on:
      traefik:
        condition: service_started
        restart: false
      vpn:
        condition: service_healthy
        restart: true
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - WEBUI_PORT=${WEBUI_PORT}
    - TORRENTING_PORT=${TORRENTING_PORT}
    # service: (not container:) so Compose tracks the dependency. It still only
    # *restarts* this container when vpn is recreated, which leaves it in the old
    # namespace; the healthcheck below catches that (see CLAUDE.md gotchas).
    network_mode: "service:vpn"
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.qbittorrent.rule=Host(`q.int.$DOMAINNAME`)"
    - "traefik.http.routers.qbittorrent.middlewares=authelia@docker"
    - "traefik.http.services.qbittorrent.loadbalancer.server.port=${WEBUI_PORT}"
    - "deunhealth.restart.on.unhealthy=true"
    volumes:
    - $VOLDIR/qbittorrent:/config:rw
    - $DATADIR/torrents/downloads:/downloads:rw
    - $VOLDIR/${VPN__NAME}:/gluetun-ip:ro
    # Unhealthy when the VPN tunnel is gone from the shared network namespace,
    # e.g. after Gluetun was recreated but this container wasn't. A restart
    # can't fix that (it rejoins the old namespace); recreate it:
    #   docker compose up -d --force-recreate <this service>
    healthcheck:
      test: ["CMD-SHELL", "test -e /sys/class/net/tun0 && curl -fso /dev/null http://localhost:8080/api/v2/app/version"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

    # Fails (goes unhealthy) if either the WebUI stops responding, or gluetun's
    # persisted public IP has changed since the last check. deunhealth then
    # restarts this container, forcing it to rebind to the current tunnel.
    # healthcheck:
    #   test:
    #   - "CMD-SHELL"
    #   - >
    #     curl -f -s -o /dev/null http://localhost:8080/api/v2/app/version && CUR=$$(cat /gluetun-ip/ip 2>/dev/null) && [ -f /config/.last_vpn_ip ] || echo "$$CUR" > /config/.last_vpn_ip; LAST=$$(cat /config/.last_vpn_ip 2>/dev/null); if [ "$$CUR" != "$$LAST" ]; then echo "$$CUR" > /config/.last_vpn_ip; exit 1; fi
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 60s
