## deunhealth  https://github.com/qdm12/deunhealth
## Restarts containers labelled deunhealth.restart.on.unhealthy=true when they
## turn unhealthy. Talks to the restart-capable socket proxy (GET + container
## restart/stop/kill), nothing else.
services:
  deunhealth:
    container_name: ${DEUNHEALTH__NAME}
    image: ${DEUNHEALTH__IMAGE}:${DEUNHEALTH__VERSION}
    restart: unless-stopped

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      socket-proxy:
        condition: service_healthy
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    environment:
      TZ: ${TZ}
      DOCKER_HOST: ${DOCKER_HOST}
      LOG_LEVEL: ${LOG_LEVEL}

    networks:
    - socket_proxy

    labels:
    - "traefik.enable=false"
    - "deunhealth.restart.on.unhealthy=false"
