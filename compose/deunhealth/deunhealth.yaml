## deunhealth  https://github.com/qdm12/deunhealth
## Restarts containers labelled deunhealth.restart.on.unhealthy=true when they
## turn unhealthy. Talks to the restart-capable socket proxy (GET + container
## restart/stop/kill), nothing else.
services:
  deunhealth:
    container_name: ${DEUNHEALTH__NAME}
    image: ${DEUNHEALTH__IMAGE}:${DEUNHEALTH__VERSION}
    restart: unless-stopped
    # Not root (the image's default): it talks to Docker over TCP via the proxy.
    user: "${PUID}:${PGID}"

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      socket-proxy:
        condition: service_healthy
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    environment:
      TZ: ${TZ}
      DOCKER_HOST: ${DOCKER_HOST}
      LOG_LEVEL: ${LOG_LEVEL}

    networks:
    - socket_proxy

    labels:
    - "traefik.enable=false"
    - "deunhealth.restart.on.unhealthy=false"
    # socket-proxy allowlist: the calls in deunhealth's source (version
    # negotiation, list, events, restart by container name). Restart only: no
    # stop/kill/inspect/archive. Single quotes: `\.` is a parse error in
    # double-quoted YAML.
    - 'socket-proxy.allow.head=/_ping'
    - 'socket-proxy.allow.get=/(_ping|v1\.[0-9]+/(version|containers/json|events))(\?.*)?'
    - 'socket-proxy.allow.post=/v1\.[0-9]+/containers/[A-Za-z0-9][A-Za-z0-9_.-]*/restart(\?.*)?'
