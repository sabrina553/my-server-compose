## Chaptarr  https://hub.docker.com/r/chaptarr/chaptarr
## Ebook/audiobook manager (a Readarr successor), at <subdomain>.<domain>
## behind Authelia. No login of its own: its UI listens only on its `arr`
## address, shared with Traefik and Prowlarr alone. Database in the shared
## Postgres; downloads via qBittorrent (http://vpn:<webui port>).
services:
  chaptarr:
    container_name: ${CHAPTARR__NAME}
    image: ${CHAPTARR__IMAGE}:${CHAPTARR__VERSION}
    restart: unless-stopped
    # Chaptarr can't read secret files, so load them into its env vars at start.
    # command is the image's CMD (overriding entrypoint discards it); re-check
    # after major upgrades:
    #   docker image inspect --format '{{json .Config.Entrypoint}} {{json .Config.Cmd}}' <image>
    entrypoint:
    - /bin/sh
    - -c
    - >-
      Chaptarr__Postgres__Password=$$(cat /run/secrets/chaptarr_db_password) &&
      export Chaptarr__Postgres__Password &&
      exec "$$@"
    - --
    - /entrypoint.sh
    command: ["dotnet", "/app/Chaptarr.dll", "-nobrowser", "-data=/config"]

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:   # entrypoint chowns /config, then drops to PUID/PGID
    - CHOWN
    - DAC_READ_SEARCH
    - FOWNER
    - SETGID
    - SETUID
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      postgres:
        condition: service_healthy
        restart: false
      traefik:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    secrets:
    - chaptarr_db_password
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      Chaptarr__Postgres__Host: ${POSTGRESQL__HOST}
      Chaptarr__Postgres__User: ${CHAPTARR__DB_USER}
      Chaptarr__Postgres__Port: ${CHAPTARR__DB_PORT}
      # No login of its own (Authelia in front). Safe only because the UI listens
      # on its `arr` address alone; it is not reachable via db_postgres or
      # chaptarr_downloads, which it only uses outbound.
      Chaptarr__Auth__Method: External
      Chaptarr__Auth__Required: Enabled
      Chaptarr__Server__BindAddress: 172.21.10.11

    networks:
      arr:
        ipv4_address: 172.21.10.11
      db_postgres:
      chaptarr_downloads:   # -> qBittorrent (vpn)

    labels:
    - "traefik.enable=true"
    - "traefik.docker.network=arr"
    - "traefik.http.routers.${CHAPTARR__NAME}.rule=Host(`${CHAPTARR__SUBDOMAIN}.${DOMAINNAME}`)"
    - "traefik.http.routers.${CHAPTARR__NAME}.middlewares=authelia@docker"
    - "traefik.http.services.${CHAPTARR__NAME}.loadbalancer.server.port=${CHAPTARR__PORT}"
    - "deunhealth.restart.on.unhealthy=true"
    # Diun: only :latest is published, so report when it changes
    - "diun.watch_repo=false"

    volumes:
    - ${VOLDIR}/${CHAPTARR__NAME}:/config:rw
    - ${DATADIR}/torrents/books:/ebooks:rw
    - ${DATADIR}/torrents/downloads:/downloads:rw

    healthcheck:
      # The UI listens only on its fixed address on `arr`, not on localhost.
      test: wget -q -O /dev/null http://172.21.10.11:${CHAPTARR__PORT}/ping || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
