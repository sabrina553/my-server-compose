## Gluetun  https://github.com/qdm12/gluetun
## WireGuard VPN client. qBittorrent, Mousehole and Mousetrap share its network
## namespace (network_mode: service:vpn), so all their traffic leaves through
## the tunnel. Also an HTTP proxy (http://vpn:8888) for FlareSolverr, Chaptarr
## and Prowlarr. Not on `external`: see the networks in compose.yaml.
## If Gluetun is recreated, recreate those containers too (see CLAUDE.md).
services:
  vpn:
    container_name: ${VPN__NAME}
    image: ${VPN__IMAGE}:${VPN__VERSION}
    restart: unless-stopped

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - NET_ADMIN
    - NET_RAW
    - CHOWN
    tmpfs:
    - /tmp:rw,noexec,nosuid,uid=${PUID},gid=${PGID}

    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    secrets:
    - vpn_wireguard_private_key
    - vpn_wireguard_preshared_key
    - vpn_wireguard_addresses
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      LOG_LEVEL: ${LOG_LEVEL}
      # Gluetun's names end in _SECRETFILE (it ignores *_FILE). Their defaults,
      # /run/secrets/wireguard_*, are not our secret names, so set them.
      WIREGUARD_PRIVATE_KEY_SECRETFILE: ${VPN__WIREGUARD_PRIVATE_KEY_FILE}
      WIREGUARD_PRESHARED_KEY_SECRETFILE: ${VPN__WIREGUARD_PRESHARED_KEY_FILE}
      WIREGUARD_ADDRESSES_SECRETFILE: ${VPN__WIREGUARD_ADDRESSES_FILE}
      VPN_SERVICE_PROVIDER: ${VPN__SERVICE_PROVIDER}
      VPN_TYPE: ${VPN__TYPE}
      SERVER_COUNTRIES: ${VPN__SERVER_COUNTRIES}
      FIREWALL_VPN_INPUT_PORTS: ${TORRENTING_PORT}
      FIREWALL_OUTBOUND_SUBNETS: ${VPN__EXTERNAL_SUBNETS}
      # No login, and it reaches every network vpn is on (socket_proxy_ro
      # included). It listens on all of vpn's networks, because Chaptarr and
      # Prowlarr use it too (their own proxy setting) as well as FlareSolverr.
      # That's acceptable only because vpn is not on `external`: what can reach
      # it is Traefik, Chaptarr, Prowlarr, FlareSolverr and socket_proxy_ro.
      HTTPPROXY: "on"
      # PUBLICIP_FILE left at its default (/tmp/gluetun/ip, tmpfs). Nothing
      # reads it. Writing it logs "permission denied" on every start, harmless:
      # Gluetun creates the folder without the execute bit (mode 644), which
      # root can't enter without DAC_OVERRIDE. Not worth adding that cap.

    networks:
      vpn_egress:            # the tunnel's way out; nothing else is on it
      vpn_ui:                # Traefik -> qBittorrent / Mousetrap UIs
      vpn_proxy:             # FlareSolverr -> HTTP proxy
      chaptarr_downloads:    # Chaptarr -> qBittorrent
      prowlarr_downloads:    # Prowlarr -> qBittorrent
      socket_proxy_ro:       # Mousetrap -> read-only Docker API (GET only)
    # No published ports on purpose. Anything published here bypasses Traefik and
    # Authelia, and Docker's iptables rules bypass the host firewall.
    #  - Web UIs (qbittorrent, mousehole, mousetrap) go through Traefik.
    #  - The HTTP proxy is reached by other containers at http://vpn:8888.
    #  - Torrent peers come in through the VPN tunnel (FIREWALL_VPN_INPUT_PORTS).
    # If you need direct access while Traefik is down, bind to localhost only and
    # use an SSH tunnel, e.g.:  - 127.0.0.1:8080:8080
    devices:
    - "/dev/net/tun:/dev/net/tun"
    sysctls:
    - net.ipv6.conf.all.disable_ipv6=1
    cpu_shares: 2048   # ensure the tunnel always gets what it needs

    labels:
    - "traefik.enable=false"
    # Traefik reads the network for qBittorrent/Mousetrap/Mousehole from THIS
    # container's labels (they share its namespace); a label on them is ignored.
    - "traefik.docker.network=vpn_ui"
    - "deunhealth.restart.on.unhealthy=false"
    #- "com.centurylinklabs.watchtower.monitor-only=true"   # Watchtower is retired

    volumes:
    - "/etc/localtime:/etc/localtime:ro"
    - "${VOLDIR}/${VPN__NAME}:/gluetun:rw"
