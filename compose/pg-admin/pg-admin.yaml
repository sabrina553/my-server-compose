services:
  pgadmin:
    container_name: postgres-web
    image: dpage/pgadmin4
    restart: unless-stopped
    # security_opt:
    #   - no-new-privileges:true
    #   - apparmor:unconfined
    # cap_drop:
    #   - ALL
    # cap_add:
    #   - AUDIT_CONTROL
    #   - AUDIT_WRITE
    #   - AUDIT_READ
    #   - CHOWN
    #   - SETGID
    #   - SETUID
    #read_only: true
    # tmpfs:
    #   - /tmp:rw,noexec,nosuid
    depends_on:
      postgres:
        condition: service_started
        restart: false
      traefik:
        condition: service_started
        restart: false
    logging:
          driver: "json-file"
          options:
            max-size: "1m"
            max-file: "3"
    environment:
      - TZ=${TZ}
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN__DEFAULT_EMAIL}
    networks:
      - internal
    labels:
      - "traefik.enable=true"       
      - "traefik.http.routers.pgadmin.rule=Host(`pg.int.$DOMAINNAME`)"      
      - "traefik.http.routers.pgadmin.middlewares=authelia@docker"  
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
      - "deunhealth.restart.on.unhealthy=true"
    volumes:
      - ${VOLDIR}/pgadmin:/var/lib/pgadmin