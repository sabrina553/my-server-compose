services:
  pgadmin:
    container_name: postgres-web
    image: ${PGADMIN__IMAGE}:${PGADMIN__VERSION}
    restart: unless-stopped
    # pgAdmin runs as uid 5050. Its entrypoint only needs sudo to start postfix
    # (mail), which is disabled below, so no-new-privileges is safe.
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    # The image's python binary carries this file capability; without it in the
    # bounding set, exec fails with "Operation not permitted".
    - NET_BIND_SERVICE
    tmpfs:
    - /tmp:rw,noexec,nosuid
    depends_on:
      postgres:
        condition: service_started
        restart: false
      traefik:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    environment:
    - TZ=${TZ}
    - PGADMIN_DEFAULT_EMAIL=${PGADMIN__DEFAULT_EMAIL}
    - PGADMIN_DISABLE_POSTFIX=true
    networks:
    - db_postgres
    - proxy_internal
    labels:
    - "traefik.enable=true"
    - "traefik.docker.network=proxy_internal"
    - "traefik.http.routers.pgadmin.rule=Host(`pg.int.$DOMAINNAME`)"
    - "traefik.http.routers.pgadmin.middlewares=authelia@docker"
    - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
    - "deunhealth.restart.on.unhealthy=true"
    volumes:
    - ${VOLDIR}/pgadmin:/var/lib/pgadmin
