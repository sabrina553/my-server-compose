services:
  ghost:
    container_name: ${GHOST__NAME}
    image: ${GHOST__IMAGE}:${GHOST__VERSION}
    restart: always
    # Ghost can't read secret files, so load them into its env vars at start.
    # command is the image's CMD (overriding entrypoint discards it); re-check
    # after major upgrades: docker image inspect --format '{{json .Config.Cmd}}' <image>
    entrypoint:
    - /bin/sh
    - -c
    - >-
      database__connection__password=$$(cat /run/secrets/ghost_db_password) &&
      mail__options__auth__pass=$$(cat /run/secrets/smtp_password) &&
      export database__connection__password mail__options__auth__pass &&
      exec "$$@"
    - --
    - docker-entrypoint.sh
    command: ["node", "current/index.js"]
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:   # entrypoint chowns content/ to node, then drops to it
    - CHOWN
    - DAC_READ_SEARCH
    - FOWNER
    - SETGID
    - SETUID
    tmpfs:
    - /tmp:rw,noexec,nosuid
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    secrets:
    - ghost_db_password
    - smtp_password
    environment:
      NODE_ENV: production
      url: https://${GHOST__DOMAIN}
      database__client: mysql
      database__connection__host: ${GHOST__DATABASE_NAME}
      database__connection__user: ${GHOST_DATABASE_USERNAME}
      database__connection__database: ${GHOST_DATABASE_USERNAME}

      mail__transport: ${GHOST__MAIL_TRANSPORT}
      mail__options__host: ${SMTP__HOST}
      mail__options__port: ${SMTP__PORT}
      mail__options__secure: ${SMTP__USE_SSL}
      mail__options__auth__user: ${SMTP__USERNAME}
      mail__from: ${GHOST__MAIL_FROM}
    networks:
    - external
    - ghost_backend
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.${GHOST__NAME}-https.rule=Host(`blog.${DOMAINNAME2}`)"
    # No authelia@docker: the blog is public and lives on DOMAINNAME2, which has no
    # Authelia session cookie. Ghost admin (/ghost) is protected by Ghost's own login.
    - "traefik.http.services.${GHOST__NAME}.loadbalancer.server.port=2368"
    - "deunhealth.restart.on.unhealthy=true"
    # Diun: only report -alpine releases
    - 'diun.include_tags=^\d+\.\d+\.\d+-alpine$$'
    volumes:
    - ${GHOST__UPLOAD_LOCATION}:/var/lib/ghost/content

  db:
    container_name: ${GHOST__DATABASE_NAME}
    image: ${GHOST__DATABASE_IMAGE}:${GHOST__DATABASE_VERSION}
    restart: always
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:   # entrypoint chowns the datadir to mysql, then drops to it
    - CHOWN
    - DAC_READ_SEARCH
    - FOWNER
    - SETGID
    - SETUID
    tmpfs:
    - /tmp:rw,noexec,nosuid
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    secrets:
    - ghost_db_root_password
    - ghost_db_password
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/ghost_db_root_password
      MYSQL_USER: ${GHOST_DATABASE_USERNAME}
      MYSQL_PASSWORD_FILE: /run/secrets/ghost_db_password
      MYSQL_DATABASE: ${GHOST_DATABASE_USERNAME}
    volumes:
    - ${GHOST__MYSQL_DATA_LOCATION}:/var/lib/mysql
    - ${GHOST__MYSQL_INIT_LOCATION}:/docker-entrypoint-initdb.d
    healthcheck:
      # No password: mysqladmin ping exits 0 whenever the server is up, even if
      # access is denied, so there's no need to put a password on the command line.
      test: mysqladmin ping -h 127.0.0.1 --silent
      interval: 1s
      start_period: 30s
      start_interval: 10s
      retries: 120
    networks:
    - ghost_backend
    labels:
    # Diun: stay on MySQL 8.0.x
    - 'diun.include_tags=^8\.0\.\d+$$'
