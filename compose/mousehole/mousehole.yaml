services:
  mousehole:
    container_name: ${MOUSEHOLE__NAME}
    image: ${MOUSEHOLE__IMAGE}:${MOUSEHOLE__VERSION}
    restart: unless-stopped
    # Mousehole can't read secret files, so load them into its env vars at start.
    # command is the image's CMD (overriding entrypoint discards it); re-check
    # after major upgrades: docker image inspect --format '{{json .Config.Cmd}}' <image>
    entrypoint:
    - /bin/sh
    - -c
    - >-
      MOUSEHOLE_AUTH_PASSWORD=$$(cat /run/secrets/mousehole_auth_password) &&
      export MOUSEHOLE_AUTH_PASSWORD &&
      exec "$$@"
    - --
    - /usr/local/bin/docker-entrypoint.sh
    command: ["bun", "run", "src/index.tsx"]
    secrets:
    - mousehole_auth_password
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid
    depends_on:
      traefik:
        condition: service_started
        restart: false
      vpn:
        condition: service_healthy
        restart: true
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    environment:
    - TZ=${TZ}
    - MOUSEHOLE_ALLOWED_HOSTS=${MOUSEHOLE__ALLOWED_HOST}
    - MOUSEHOLE_ALLOWED_ORIGINS=${MOUSEHOLE__ALLOWED_ORIGINS}
    - MOUSEHOLE_HTTPS_ONLY_COOKIES=${MOUSEHOLE__HTTPS_ONLY_COOKIES}
    network_mode: "service:vpn"
    # Unhealthy when the VPN tunnel is gone from the shared network namespace,
    # e.g. after Gluetun was recreated but this container wasn't. A restart
    # can't fix that (it rejoins the old namespace); recreate it:
    #   docker compose up -d --force-recreate <this service>
    healthcheck:
      test: ["CMD-SHELL", "test -e /sys/class/net/tun0"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.${MOUSEHOLE__NAME}.rule=Host(`${MOUSEHOLE__NAME}.int.${DOMAINNAME}`)"
    - "traefik.http.routers.${MOUSEHOLE__NAME}.middlewares=authelia@docker"
    - "traefik.http.services.${MOUSEHOLE__NAME}.loadbalancer.server.port=5010"
    - "deunhealth.restart.on.unhealthy=true"
    volumes:
    - ${VOLDIR}/${MOUSEHOLE__NAME}:/var/lib/mousehole:rw
