## Watchtower  https://github.com/nicholas-fedor/watchtower
## RETIRED: replaced by Diun, which only notifies (see docs/decisions.md).
## Kept for reference and disabled in compose.yaml. It would not work anyway:
## it needs Docker API write access, which no socket proxy here grants.
## Warning: with WATCHTOWER_REMOVE_VOLUMES=true it deletes anonymous volumes
## when it replaces a container.
services:
  watchtower:
    container_name: ${WATCHTOWER__NAME}
    image: ${WATCHTOWER__IMAGE}:${WATCHTOWER__VERSION}
    restart: unless-stopped

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      socket-proxy:
        condition: service_started
        restart: true
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    environment:
      TZ: ${TZ}
      DOCKER_HOST: ${DOCKER_HOST}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "true"
      WATCHTOWER_LABEL_TAKE_PRECEDENCE: "true"
      WATCHTOWER_USE_COMPOSE_DEPENDS_ON: "false"
      WATCHTOWER_POLL_INTERVAL: "3600"
      WATCHTOWER_REMOVE_VOLUMES: "true"
      WATCHTOWER_TIMEOUT: "30s"

    networks:
    - external
    - socket_proxy

    # All labels commented out while Watchtower is retired.
    #labels:
    #- "traefik.enable=false"
    #- "deunhealth.restart.on.unhealthy=true"
    #- "com.centurylinklabs.watchtower.monitor-only=true"
