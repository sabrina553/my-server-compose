services:
  homeassistant:
    container_name: homeassistant
    image: ${HOMEASSISTANT__IMAGE}:${HOMEASSISTANT__VERSION}
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    - apparmor:unconfined
    cap_drop:
    - ALL
    #read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid
    depends_on:
      traefik:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    networks:
    - external
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.homeassistant.rule=Host(`ha.$DOMAINNAME`)"
    # No authelia@docker: forward-auth breaks the Companion app. HA is protected
    # by its own login + Authelia SSO (hass-openid, two_factor OIDC client).
    - "traefik.http.services.homeassistant.loadbalancer.server.port=8123"
    - "deunhealth.restart.on.unhealthy=true"
    volumes:
    - ${VOLDIR}/home-assistant:/config:rw
    - /etc/localtime:/etc/localtime:ro
    - /run/dbus:/run/dbus:ro
