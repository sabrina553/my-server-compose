## Home Assistant  https://github.com/home-assistant/core
## Home automation at <subdomain>.<domain>. No forward-auth (it breaks the
## Companion app): its own login plus Authelia SSO (hass-openid, two_factor
## OIDC client); the password form is blocked (block_login). Trusts
## X-Forwarded-For only from Traefik (trusted_proxies in its configuration.yaml).
services:
  homeassistant:
    container_name: ${HOMEASSISTANT__NAME}
    image: ${HOMEASSISTANT__IMAGE}:${HOMEASSISTANT__VERSION}
    restart: unless-stopped

    # No host D-Bus and no apparmor:unconfined. The container runs as root, and
    # the host's system bus treats it as host root, which can ask systemd to run
    # anything: that was root on the host. For Bluetooth, use an ESPHome
    # Bluetooth proxy rather than mounting /run/dbus (see docs/decisions.md).
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    #read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      traefik:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    networks:
    - external

    labels:
    - "traefik.enable=true"
    # No authelia@docker: forward-auth breaks the Companion app (see the header).
    - "traefik.http.routers.${HOMEASSISTANT__NAME}.rule=Host(`${HOMEASSISTANT__SUBDOMAIN}.${DOMAINNAME}`)"
    - "traefik.http.services.${HOMEASSISTANT__NAME}.loadbalancer.server.port=8123"
    - "deunhealth.restart.on.unhealthy=true"

    volumes:
    - ${HOMEASSISTANT__VOLDIR}:/config:rw
    - /etc/localtime:/etc/localtime:ro
