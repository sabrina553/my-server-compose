## Authelia  https://github.com/authelia/authelia
## Login, 2FA and OIDC provider for the whole stack. Users come from LLDAP,
## state lives in Postgres, sessions in its own Valkey (authelia-redis).
## Defines the authelia@docker forward-auth middleware every router uses.
## configuration.yml (mounted read-only) is a Go template: see its header.
services:
  authelia:
    container_name: ${AUTHELIA__NAME}
    image: ${AUTHELIA__IMAGE}:${AUTHELIA__VERSION}
    restart: unless-stopped
    # Non-root from the start: the entrypoint then skips its chown/su-exec and
    # runs authelia directly, so no capabilities are needed.
    user: "${PUID}:${PGID}"

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    # Authelia writes /app/.healthcheck.env on every start (path hard-coded) and
    # treats a failed write as a fatal start-up check; see the bind mount below.
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      postgres:
        condition: service_healthy
        restart: false
      lldap:
        condition: service_started
        restart: false
      authelia-redis:
        condition: service_healthy
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    secrets:
    - authelia_jwt_secret
    - authelia_session_secret
    - authelia_db_password
    - authelia_storage_encryption_key
    - authelia_oidc_hmac_secret
    - authelia_oidc_jwks_key
    - authelia_ldap_password
    - authelia_redis_password
    - smtp_password
    # OIDC client IDs (shared with each app)
    - filebrowser_oidc_client_id
    - freshrss_oidc_client_id
    - grimmory_oidc_client_id
    - homeassistant_oidc_client_id
    - immich_oidc_client_id
    - leantime_oidc_client_id
    - linkwarden_oidc_client_id
    - mealie_oidc_client_id
    - vaultwarden_oidc_client_id
    # OIDC client secret digests (Authelia only)
    - authelia_oidc_filebrowser_digest
    - authelia_oidc_freshrss_digest
    - authelia_oidc_grimmory_digest
    - authelia_oidc_homeassistant_digest
    - authelia_oidc_immich_digest
    - authelia_oidc_leantime_digest
    - authelia_oidc_linkwarden_digest
    - authelia_oidc_mealie_digest
    - authelia_oidc_vaultwarden_digest
    environment:
      # configuration.yml is a Go template; see the header of that file.
      X_AUTHELIA_CONFIG_FILTERS: template
      TZ: ${TZ}
      AUTHELIA_LOG_LEVEL: ${LOG_LEVEL}
      # Read by the template with {{ env "..." }}. Deliberately NOT prefixed
      # AUTHELIA_: Authelia treats those as config keys and rejects unknown ones.
      DOMAINNAME: ${DOMAINNAME}
      SUBDOMAIN_AUDIOBOOKSHELF: ${AUDIOBOOKSHELF__SUBDOMAIN}
      SUBDOMAIN_AUTHELIA: ${AUTHELIA__SUBDOMAIN}
      SUBDOMAIN_BOOKKEEP: ${BOOKKEEP__SUBDOMAIN}
      SUBDOMAIN_CHAPTARR: ${CHAPTARR__SUBDOMAIN}
      SUBDOMAIN_COUCHDB: ${COUCHDB__SUBDOMAIN}
      SUBDOMAIN_FILEBROWSER: ${FILEBROWSER__SUBDOMAIN}
      SUBDOMAIN_FRESHRSS: ${FRESHRSS__SUBDOMAIN}
      SUBDOMAIN_GRIMMORY: ${GRIMMORY__SUBDOMAIN}
      SUBDOMAIN_HOMEASSISTANT: ${HOMEASSISTANT__SUBDOMAIN}
      SUBDOMAIN_IMMICH: ${IMMICH__SUBDOMAIN}
      SUBDOMAIN_LEANTIME: ${LEAN__SUBDOMAIN}
      SUBDOMAIN_LINKWARDEN: ${LINKWARDEN__SUBDOMAIN}
      SUBDOMAIN_MEALIE: ${MEALIE__SUBDOMAIN}
      SUBDOMAIN_VAULTWARDEN: ${VAULTWARDEN__SUBDOMAIN}

      AUTHELIA_SESSION_SECRET_FILE: ${AUTHELIA__SESSION_SECRET}
      # Sessions live in Valkey so they survive Authelia restarts.
      AUTHELIA_SESSION_REDIS_HOST: ${AUTHELIA__SESSION_REDIS_HOST}
      AUTHELIA_SESSION_REDIS_PORT: ${AUTHELIA__SESSION_REDIS_PORT}
      AUTHELIA_SESSION_REDIS_PASSWORD_FILE: ${AUTHELIA__SESSION_REDIS_PASSWORD}

      AUTHELIA_STORAGE_POSTGRES_ADDRESS: ${POSTGRESQL__HOST}
      AUTHELIA_STORAGE_POSTGRES_DATABASE: ${AUTHELIA__DB_NAME}
      AUTHELIA_STORAGE_POSTGRES_USERNAME: ${AUTHELIA__DB_USERNAME}
      AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE: ${AUTHELIA__STORAGE_PASSWORD}
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: ${AUTHELIA__STORAGE_ENCRYPTION_KEY}

      AUTHELIA_NOTIFIER_SMTP_ADDRESS: ${AUTHELIA__NOTIFIER_SMTP_ADDRESS}
      AUTHELIA_NOTIFIER_SMTP_USERNAME: ${SMTP__USERNAME}
      AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE: ${SMTP__PASSWORD}
      AUTHELIA_NOTIFIER_SMTP_SENDER: ${AUTHELIA__NOTIFIER_SMTP_SENDER}
      AUTHELIA_NOTIFIER_SMTP_SUBJECT: ${AUTHELIA__NOTIFIER_SMTP_SUBJECT}

      # The lldap_backend-only alias (see lldap.yaml): LDAP listens there alone.
      # Set here, not in .env.example: it's part of the network isolation.
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_ADDRESS: ldap://lldap-ldap:3890
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_BASE_DN: ${LLDAP__LDAP_BASE_DN}
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE: ${AUTHELIA__AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE}
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_IMPLEMENTATION: ${AUTHELIA__AUTHENTICATION_BACKEND_LDAP_IMPLEMENTATION}
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_USER: ${AUTHELIA__AUTHENTICATION_BACKEND_LDAP_USER}

      # access_control.default_policy is set in configuration.yml (deny).
      # Don't set AUTHELIA_ACCESS_CONTROL_DEFAULT_POLICY here: env vars
      # override the file and would silently weaken it.

      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: ${AUTHELIA__JWT_SECRET}
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: ${AUTHELIA__IDENTITY_HMAC_SECRET}

    networks:
    - authelia_backend
    - db_postgres
    - lldap_backend   # LDAP
    - external

    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.${AUTHELIA__NAME}.rule=Host(`${AUTHELIA__SUBDOMAIN}.${DOMAINNAME}`)"
    - "traefik.http.routers.${AUTHELIA__NAME}.entrypoints=websecure"
    - "traefik.http.routers.${AUTHELIA__NAME}.tls=true"
    - "traefik.http.services.${AUTHELIA__NAME}.loadbalancer.server.port=9091"
    # The forward-auth middleware, referenced as authelia@docker by every
    # protected router. Its name is fixed on purpose. The address uses the
    # service key, so it doesn't depend on AUTHELIA__NAME.
    - "traefik.http.middlewares.authelia.forwardAuth.address=http://authelia:9091/api/authz/forward-auth"
    - "traefik.http.middlewares.authelia.forwardAuth.trustForwardHeader=true"
    - "traefik.http.middlewares.authelia.forwardAuth.maxResponseBodySize=8192"
    - "traefik.http.middlewares.authelia.forwardAuth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Email,Remote-Name"

    volumes:
    # Read-only: Authelia stores state in Postgres and never needs to write here.
    - ".:/config:ro"
    # The only writable file (read_only above). Create it once, owned by
    # PUID:PGID; create_host_path: false makes a missing file an error instead
    # of Docker creating a directory in its place.
    - type: bind
      source: ${VOLDIR}/${AUTHELIA__NAME}/.healthcheck.env
      target: /app/.healthcheck.env
      bind:
        create_host_path: false
