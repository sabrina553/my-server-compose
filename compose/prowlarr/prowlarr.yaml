## Prowlarr  https://github.com/linuxserver/docker-prowlarr
## FlareSolverr  https://github.com/FlareSolverr/FlareSolverr
## Prowlarr manages indexers for Chaptarr; FlareSolverr solves Cloudflare
## challenges for it, going out only through the VPN's HTTP proxy (it has no
## internet access of its own, and only Prowlarr can reach it). Prowlarr has no
## login of its own: its UI listens only on its `arr` address, shared with
## Traefik (behind Authelia, <subdomain>.int.<domain>) and Chaptarr alone.
services:
  flaresolverr:
    container_name: ${FLARESOLVERR__NAME}
    image: ${FLARESOLVERR__IMAGE}:${FLARESOLVERR__VERSION}
    restart: unless-stopped
    # Stays the image's own uid 1000, not PUID: undetected-chromedriver patches
    # /app/chromedriver, which that uid owns (tested 2026-10-10: any other uid
    # fails with "Permission denied"). userns-remap is what covers it.

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    #read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid

    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    environment:
      TZ: ${TZ}
      PROXY_URL: ${VPN__PROXY_URL}

    networks:
    - vpn_proxy               # -> Gluetun's HTTP proxy, its only way out
    - prowlarr_flaresolverr   # <- Prowlarr

    labels:
    - "deunhealth.restart.on.unhealthy=true"

    volumes:
    - ${FLARESOLVERR__VOLDIR}:/config

    healthcheck:
      test: curl -fsS -o /dev/null http://127.0.0.1:8191/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s

  prowlarr:
    container_name: ${PROWLARR__NAME}
    image: ${PROWLARR__IMAGE}:${PROWLARR__VERSION}
    restart: unless-stopped

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:   # linuxserver init creates /run/prowlarr-temp and chowns it to abc
    - CHOWN
    - FOWNER
    - SETGID
    - SETUID
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      traefik:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      # No login of its own (Authelia in front). Safe only because the UI listens
      # on its `arr` address alone, which nothing but Traefik and Chaptarr share.
      PROWLARR__AUTH__METHOD: External
      PROWLARR__AUTH__REQUIRED: Enabled
      PROWLARR__SERVER__BINDADDRESS: 172.21.10.10

    networks:
      arr:
        ipv4_address: 172.21.10.10
      prowlarr_downloads:      # -> qBittorrent (vpn)
      prowlarr_flaresolverr:   # -> FlareSolverr

    labels:
    - "traefik.enable=true"
    - "traefik.docker.network=arr"
    - "traefik.http.routers.${PROWLARR__NAME}.rule=Host(`${PROWLARR__SUBDOMAIN}.int.${DOMAINNAME}`)"
    - "traefik.http.routers.${PROWLARR__NAME}.middlewares=authelia@docker"
    - "traefik.http.services.${PROWLARR__NAME}.loadbalancer.server.port=9696"
    - "deunhealth.restart.on.unhealthy=true"

    volumes:
    - ${VOLDIR}/${PROWLARR__NAME}/:/config:rw

    healthcheck:
      # The UI listens only on its fixed address on `arr`, not on localhost.
      test: curl -fsS -o /dev/null http://172.21.10.10:9696/ping || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s
