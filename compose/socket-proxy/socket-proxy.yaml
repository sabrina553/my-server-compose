## Docker socket proxies  https://github.com/linuxserver/docker-socket-proxy
## Two proxies so that nothing can write to the Docker API.
## General write access (POST + CONTAINERS) is equivalent to root on the host:
## it can start a privileged container that mounts /. Neither proxy allows it.
##
##   socket-proxy-ro  GET only. Traefik, Dozzle, Diun, Mousetrap (via the vpn
##                    container, so its whole namespace).  network: socket_proxy_ro
##   socket-proxy     GET + restart/stop/kill. deunhealth.  network: socket_proxy
##
## Keep internet-facing containers (and anything sharing their network
## namespace, e.g. everything on network_mode: service:vpn) OFF socket_proxy.
## Note that even read access exposes every container's environment variables
## via inspect, so keep secrets in *_FILE / Docker secrets, not plain env.

x-socket-proxy-common: &socket-proxy-common
  image: ${SOCKET_PROXY__IMAGE}:${SOCKET_PROXY__VERSION}
  restart: unless-stopped

  security_opt:
  - no-new-privileges:true
  cap_drop:
  - ALL
  read_only: true
  tmpfs:
  - "/run"

  logging:
    driver: "json-file"
    options:
      max-size: "1m"
      max-file: "3"

  labels:
  - "traefik.enable=false"
  - "deunhealth.restart.on.unhealthy=true"
  #- "com.centurylinklabs.watchtower.monitor-only=true"   # Watchtower is retired

  volumes:
  - "/var/run/docker.sock:/var/run/docker.sock:ro"

  healthcheck:
    interval: "30s"
    timeout: "5s"
    retries: 3
    start_period: "10s"
    test: "wget --no-verbose --tries=1 --spider http://localhost:2375/_ping || exit 1"

services:
  socket-proxy-ro:
    <<: *socket-proxy-common
    container_name: ${SOCKET_PROXY__RO_NAME}
    environment:
      TZ: "${TZ}"
      LOG_LEVEL: "warning" # debug, info, notice, warning, err, crit, alert, emerg
      DISABLE_IPV6: "0"
      # Read-only: no POST, and no start/stop/restart either.
      POST: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_RESTARTS: "0"
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      NETWORKS: "1"
      PING: "1"
      VERSION: "1"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EXEC: "0"
      IMAGES: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
    networks:
    - socket_proxy_ro

  socket-proxy:
    <<: *socket-proxy-common
    container_name: ${SOCKET_PROXY__NAME}
    environment:
      TZ: "${TZ}"
      LOG_LEVEL: "warning" # debug, info, notice, warning, err, crit, alert, emerg
      DISABLE_IPV6: "0"
      # deunhealth: read container health, restart unhealthy ones. ALLOW_RESTARTS
      # permits POST /containers/<id>/{restart,stop,kill} (the image has no
      # restart-only switch); every other POST is refused. Worst case for a
      # compromised client: containers stopped, never created or changed.
      POST: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_RESTARTS: "1"
      CONTAINERS: "1"
      EVENTS: "1"
      IMAGES: "0"
      INFO: "1"
      NETWORKS: "0"
      PING: "1"
      VERSION: "1"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EXEC: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
    networks:
    - socket_proxy
