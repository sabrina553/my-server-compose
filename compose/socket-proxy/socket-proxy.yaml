## Docker socket proxies
##   https://github.com/wollomatic/socket-proxy        (socket-proxy-ro)
##   https://github.com/linuxserver/docker-socket-proxy (socket-proxy)
## Two proxies so that nothing can write to the Docker API.
## General write access (POST + CONTAINERS) is equivalent to root on the host:
## it can start a privileged container that mounts /. Neither proxy allows it.
##
##   socket-proxy-ro  Per-client allowlists (method + path regex) from labels
##                    on each client: Traefik, Dozzle, Diun. A container
##                    without labels is refused. network: socket_proxy_ro
##   socket-proxy     GET + restart/stop/kill. deunhealth.  network: socket_proxy
##
## "GET only" is not read-only enough: GET /containers/{id}/archive and
## /export return any file or a whole filesystem from any container
## (/run/secrets included). Never allow those, and never allow `.*`.
## Keep internet-facing containers (and anything sharing their network
## namespace, e.g. everything on network_mode: service:vpn) off both networks.
## Even inspect exposes every container's environment variables, so keep
## secrets in *_FILE / Docker secrets, not plain env.

x-socket-proxy-common: &socket-proxy-common
  image: ${SOCKET_PROXY__IMAGE}:${SOCKET_PROXY__VERSION}
  restart: unless-stopped

  security_opt:
  - no-new-privileges:true
  cap_drop:
  - ALL
  read_only: true
  tmpfs:
  - "/run"

  logging:
    driver: "json-file"
    options:
      max-size: "1m"
      max-file: "3"

  labels:
  - "traefik.enable=false"
  - "deunhealth.restart.on.unhealthy=true"
  #- "com.centurylinklabs.watchtower.monitor-only=true"   # Watchtower is retired

  volumes:
  - "/var/run/docker.sock:/var/run/docker.sock:ro"

  healthcheck:
    interval: "30s"
    timeout: "5s"
    retries: 3
    start_period: "10s"
    test: "wget --no-verbose --tries=1 --spider http://localhost:2375/_ping || exit 1"

services:
  socket-proxy-ro:
    container_name: ${SOCKET_PROXY__RO_NAME}
    image: ${SOCKET_PROXY__RO_IMAGE}:${SOCKET_PROXY__RO_VERSION}
    restart: unless-stopped
    # nobody, plus the group that owns docker.sock.
    user: "65534:${SOCKET_PROXY__DOCKER_GID}"
    command:
    # Refused requests are logged at INFO/WARN. To see what a client asks for
    # (e.g. after an upgrade breaks it), switch to DEBUG: every request is
    # logged with its path.
    - "-loglevel=INFO"
    - "-listenip=0.0.0.0"
    # Per-client allowlists come from labels (socket-proxy.allow.<method>) on
    # each client. -allowfrom stays at its default (127.0.0.1/32), so a
    # container without labels gets nothing.
    - "-proxycontainername=${SOCKET_PROXY__RO_NAME}"
    - "-allowhealthcheck"
    # If the Docker socket goes away (e.g. a daemon upgrade), exit so the
    # restart policy brings it back with a fresh connection.
    - "-watchdoginterval=600"
    - "-stoponwatchdog"
    - "-shutdowngracetime=5"

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true

    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    networks:
    - socket_proxy_ro

    labels:
    - "traefik.enable=false"
    - "deunhealth.restart.on.unhealthy=true"

    volumes:
    # :ro has no effect on a socket (it only stops replacing the file); the
    # allowlists are what limit access.
    - "/var/run/docker.sock:/var/run/docker.sock:ro"

    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  socket-proxy:
    <<: *socket-proxy-common
    container_name: ${SOCKET_PROXY__NAME}
    environment:
      TZ: "${TZ}"
      LOG_LEVEL: "warning" # debug, info, notice, warning, err, crit, alert, emerg
      DISABLE_IPV6: "0"
      # deunhealth: read container health, restart unhealthy ones. ALLOW_RESTARTS
      # permits POST /containers/<id>/{restart,stop,kill} (the image has no
      # restart-only switch); every other POST is refused. Worst case for a
      # compromised client: containers stopped, never created or changed.
      POST: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_RESTARTS: "1"
      CONTAINERS: "1"
      EVENTS: "1"
      IMAGES: "0"
      INFO: "1"
      NETWORKS: "0"
      PING: "1"
      VERSION: "1"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EXEC: "0"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
    networks:
    - socket_proxy
