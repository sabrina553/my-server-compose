services:
  crosswatch:
    container_name: ${CROSSWATCH__NAME}
    image: ${CROSSWATCH__IMAGE}:${CROSSWATCH__VERSION}
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    - apparmor:unconfined
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    tmpfs:
    - /tmp:rw,noexec,nosuid
    depends_on:
      traefik:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    environment:
      TZ: ${TZ}
    networks:
    - external
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.${CROSSWATCH__NAME}.rule=Host(`${CROSSWATCH__NAME}.int.${DOMAINNAME}`)"
    - "traefik.http.routers.${CROSSWATCH__NAME}.middlewares=authelia@docker"
    - "traefik.http.services.${CROSSWATCH__NAME}.loadbalancer.server.port=8787"
    - "deunhealth.restart.on.unhealthy=true"
    volumes:
    - ${VOLDIR}/${CROSSWATCH__NAME}:/config:rw
