## CrossWatch  https://github.com/cenodude/crosswatch
## Syncs watch history between media services, at <subdomain>.int.<domain>
## behind Authelia (2FA).
services:
  crosswatch:
    container_name: ${CROSSWATCH__NAME}
    image: ${CROSSWATCH__IMAGE}:${CROSSWATCH__VERSION}
    restart: unless-stopped

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:   # entrypoint chowns /config, then drops to its user
    - CHOWN
    - SETGID
    - SETUID
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      traefik:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    environment:
      TZ: ${TZ}
      # Its entrypoint's names for PUID/PGID (default 1000).
      APP_UID: ${PUID}
      APP_GID: ${PGID}

    networks:
    - external

    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.${CROSSWATCH__NAME}.rule=Host(`${CROSSWATCH__SUBDOMAIN}.int.${DOMAINNAME}`)"
    - "traefik.http.routers.${CROSSWATCH__NAME}.middlewares=authelia@docker"
    - "traefik.http.services.${CROSSWATCH__NAME}.loadbalancer.server.port=8787"
    - "deunhealth.restart.on.unhealthy=true"

    volumes:
    - ${VOLDIR}/${CROSSWATCH__NAME}:/config:rw
