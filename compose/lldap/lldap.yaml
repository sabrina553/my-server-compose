## LLDAP  https://github.com/lldap/lldap
## User and group directory for Authelia (LDAP on 3890, internal only). Admin
## UI at <subdomain>.int.<domain>, behind Authelia. Data lives in Postgres.
services:
  lldap:
    container_name: ${LLDAP__NAME}
    image: ${LLDAP__IMAGE}:${LLDAP__VERSION}
    restart: unless-stopped

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:   # entrypoint chowns /data to UID/GID, then drops to it
    - CHOWN
    # The entrypoint checks /data is writable while still root; /data is owned
    # by UID, so root needs DAC_OVERRIDE (DAC_READ_SEARCH only covers reads).
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      postgres:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    secrets:
    - smtp_password
    - lldap_jwt_secret
    - lldap_key_seed
    - lldap_admin_password
    - lldap_db_url
    environment:
      UID: ${PUID}
      GID: ${PGID}
      TZ: ${TZ}
      LLDAP_JWT_SECRET_FILE: ${LLDAP__JWT_SECRET}
      LLDAP_KEY_SEED_FILE: ${LLDAP__KEY_SEED}
      LLDAP_LDAP_BASE_DN: ${LLDAP__LDAP_BASE_DN}
      LLDAP_LDAP_USER_PASS_FILE: ${LLDAP__LDAP_USER_PASS}
      LLDAP_DATABASE_URL_FILE: ${LLDAP__DATABASE_URL}
      LLDAP_HTTP_URL: ${LLDAP__HTTP_URL}
      LLDAP_SMTP_OPTIONS__ENABLE_PASSWORD_RESET: ${LLDAP__SMTP_OPTIONS__ENABLE_PASSWORD_RESET}
      LLDAP_SMTP_OPTIONS__SERVER: ${SMTP__HOST}
      LLDAP_SMTP_OPTIONS__PORT: ${SMTP__PORT}
      LLDAP_SMTP_OPTIONS__SMTP_ENCRYPTION: ${LLDAP__SMTP_OPTIONS__SMTP_ENCRYPTION}
      LLDAP_SMTP_OPTIONS__USER: ${SMTP__USERNAME}
      LLDAP_SMTP_OPTIONS__PASSWORD_FILE: ${SMTP__PASSWORD}
      LLDAP_SMTP_OPTIONS__FROM: ${LLDAP__SMTP_OPTIONS__FROM}
      LLDAP_SMTP_OPTIONS__TO: ${LLDAP__SMTP_OPTIONS__TO}
      # For LDAPS: enable, and mount a certificate and key.
      #LLDAP_LDAPS_OPTIONS__ENABLED: "true"
      #LLDAP_LDAPS_OPTIONS__CERT_FILE: /path/to/certfile.crt
      #LLDAP_LDAPS_OPTIONS__KEY_FILE: /path/to/keyfile.key

    networks:
    - external
    - db_postgres
    # No published ports: LDAP (3890) is reached over the Docker network only,
    # and the web UI through Traefik.

    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.${LLDAP__NAME}.rule=Host(`${LLDAP__SUBDOMAIN}.int.${DOMAINNAME}`)"
    - "traefik.http.routers.${LLDAP__NAME}.middlewares=authelia@docker"
    - "traefik.http.services.${LLDAP__NAME}.loadbalancer.server.port=17170"
    - "deunhealth.restart.on.unhealthy=true"
    # Diun: only report -alpine releases
    - 'diun.include_tags=^v\d+\.\d+\.\d+-alpine$$'

    volumes:
    - ${VOLDIR}/${LLDAP__NAME}:/data
