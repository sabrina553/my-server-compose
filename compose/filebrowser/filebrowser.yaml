services:
  filebrowser:
    container_name: filebrowser
    image: ${FILEBROWSER__IMAGE}:${FILEBROWSER__VERSION}
    restart: unless-stopped
    # FileBrowser can't read secret files, so load them into its env vars at start.
    # The image has no CMD, so only its ENTRYPOINT is repeated here.
    entrypoint:
    - /bin/sh
    - -c
    - >-
      FILEBROWSER_OIDC_CLIENT_ID=$$(cat /run/secrets/filebrowser_oidc_client_id) &&
      FILEBROWSER_OIDC_CLIENT_SECRET=$$(cat /run/secrets/filebrowser_oidc_client_secret) &&
      export FILEBROWSER_OIDC_CLIENT_ID FILEBROWSER_OIDC_CLIENT_SECRET &&
      exec "$$@"
    - --
    - ./filebrowser
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    #read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid
    depends_on:
      traefik:
        condition: service_started
        restart: false
      authelia:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    secrets:
    - filebrowser_oidc_client_id
    - filebrowser_oidc_client_secret
    environment:
    - TZ=${TZ}
    - PUID=${PUID}
    - PGID=${PGID}
    - FILEBROWSER_DATABASE=${FILEBROWSER__DATABASE}
    # Only Traefik shares this network: FileBrowser logs users in from
    # Authelia's Remote-User header (auth.methods.proxy in its config.yaml),
    # so nothing else may be able to reach it. It needs no internet access.
    networks:
    - filebrowser_proxy
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.filebrowser.rule=Host(`files.${DOMAINNAME}`)"
    - "traefik.http.routers.filebrowser.middlewares=authelia@docker"
    - "traefik.docker.network=filebrowser_proxy"
    - "traefik.http.services.filebrowser.loadbalancer.server.port=80"
    # Diun: only report -stable releases
    - 'diun.include_tags=^\d+\.\d+\.\d+-stable$$'
    volumes:
    - ${DATADIR}/filebrowser:/srv:rw # Do not use a root "/" directory or include the "/var" folder
    - ${VOLDIR}/filebrowser:${FILEBROWSER__DATABASE_PATH}:rw # Do not use a root "/" directory or include the "/var" folder
