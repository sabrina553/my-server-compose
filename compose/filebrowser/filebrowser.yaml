## FileBrowser Quantum  https://github.com/gtsteffaniak/filebrowser
## File manager at <subdomain>.<domain>, behind Authelia (2FA). Logs users in
## from Authelia's Remote-User header (auth.methods.proxy in its config.yaml),
## so it sits on filebrowser_proxy with Traefik alone and has no internet
## access. Its OIDC settings stay wired up as a fallback (disabled in config.yaml).
## Gotchas (2026-10-10): accounts must have login method "proxy" (one created by
## OIDC gets 403 on a header login); proxy.createUser is ignored, so anyone
## Authelia admits gets an account (userDefaults permissions), and one named
## like auth.adminUsername (default "admin") is made admin; Authelia refuses
## LLDAP's built-in admin, so that name never arrives. 1.5.8 ignores
## userGroups/groupsClaim for proxy logins (newer releases check them: add
## groupsClaim "Remote-Groups" + userGroups after upgrading). OIDC needs
## internet access to reach Authelia's public URL, which this network lacks: for
## a one-off OIDC login, `docker network connect external filebrowser`, then
## `up -d --force-recreate filebrowser` to drop it again.
services:
  filebrowser:
    container_name: ${FILEBROWSER__NAME}
    image: ${FILEBROWSER__IMAGE}:${FILEBROWSER__VERSION}
    restart: unless-stopped
    # The image runs as its own uid 1000 and ignores PUID/PGID, so set them here.
    # Its cache is data/cache (cacheDir in config.yaml): the image's
    # /home/filebrowser/tmp belongs to uid 1000.
    user: "${PUID}:${PGID}"
    # FileBrowser can't read secret files, so load them into its env vars at start.
    # The image has no CMD, so only its ENTRYPOINT is repeated here.
    entrypoint:
    - /bin/sh
    - -c
    - >-
      FILEBROWSER_OIDC_CLIENT_ID=$$(cat /run/secrets/filebrowser_oidc_client_id) &&
      FILEBROWSER_OIDC_CLIENT_SECRET=$$(cat /run/secrets/filebrowser_oidc_client_secret) &&
      export FILEBROWSER_OIDC_CLIENT_ID FILEBROWSER_OIDC_CLIENT_SECRET &&
      exec "$$@"
    - --
    - ./filebrowser

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    #read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      traefik:
        condition: service_started
        restart: false
      authelia:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    secrets:
    - filebrowser_oidc_client_id
    - filebrowser_oidc_client_secret
    environment:
      TZ: ${TZ}
      FILEBROWSER_DATABASE: ${FILEBROWSER__DATABASE}

    # Only Traefik shares this network: FileBrowser trusts the Remote-User
    # header, so nothing else may be able to reach it. No internet needed.
    networks:
    - filebrowser_proxy

    labels:
    - "traefik.enable=true"
    - "traefik.docker.network=filebrowser_proxy"
    - "traefik.http.routers.${FILEBROWSER__NAME}.rule=Host(`${FILEBROWSER__SUBDOMAIN}.${DOMAINNAME}`)"
    - "traefik.http.routers.${FILEBROWSER__NAME}.middlewares=authelia@docker"
    - "traefik.http.services.${FILEBROWSER__NAME}.loadbalancer.server.port=${FILEBROWSER__PORT}"
    # Diun: only report -stable releases
    - 'diun.include_tags=^\d+\.\d+\.\d+-stable$$'

    volumes:
    # Neither may be "/" or include /var.
    - ${DATADIR}/filebrowser:/srv:rw
    - ${VOLDIR}/${FILEBROWSER__NAME}:${FILEBROWSER__DATABASE_PATH}:rw
