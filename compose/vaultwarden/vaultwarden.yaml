## Vaultwarden  https://github.com/dani-garcia/vaultwarden
## Bitwarden-compatible password manager at <subdomain>.<domain>. No
## forward-auth on the main router (it breaks the Bitwarden apps and
## extensions): its own login plus Authelia SSO (two_factor OIDC client).
## /admin is browser-only, so it also sits behind Authelia, as well as the
## admin token (argon2 hash in secrets/vaultwarden/admin_token).
services:
  vaultwarden:
    container_name: ${VAULTWARDEN__NAME}
    image: ${VAULTWARDEN__IMAGE}:${VAULTWARDEN__VERSION}
    restart: unless-stopped
    # Not root (the image's default): it needs none.
    user: "${PUID}:${PGID}"

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      traefik:
        condition: service_started
        restart: false
      postgres:
        condition: service_healthy
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    secrets:
    - vaultwarden_db_url
    - vaultwarden_oidc_client_id
    - vaultwarden_oidc_client_secret
    - vaultwarden_admin_token
    - vaultwarden_push_installation_id
    - vaultwarden_push_installation_key
    - smtp_password
    environment:
      TZ: ${TZ}
      DOMAIN: ${VAULTWARDEN__DOMAIN}
      # Also read by the image's healthcheck.
      ROCKET_PORT: ${VAULTWARDEN__PORT}
      # Must contain an argon2 PHC string, not a plaintext token. Generate with:
      #   docker run --rm -it vaultwarden/server /vaultwarden hash --preset owasp
      ADMIN_TOKEN_FILE: /run/secrets/vaultwarden_admin_token
      WEBSOCKET_ENABLED: ${VAULTWARDEN__WEBSOCKET_ENABLED}
      SIGNUPS_ALLOWED: ${VAULTWARDEN__SIGNUPS_ALLOWED}
      SMTP_HOST: ${SMTP__HOST}
      SMTP_FROM: ${VAULTWARDEN__SMTP_FROM}
      SMTP_TIMEOUT: ${SMTP__TIMEOUT}
      SMTP_USERNAME: ${SMTP__USERNAME}
      SMTP_SECURITY: ${SMTP__SECURITY}
      SMTP_PORT: ${SMTP__PORT}
      SMTP_PASSWORD_FILE: ${SMTP__PASSWORD}
      PUSH_ENABLED: ${VAULTWARDEN__PUSH_ENABLED}
      PUSH_RELAY_URI: ${VAULTWARDEN__PUSH_RELAY_URI}
      PUSH_IDENTITY_URI: ${VAULTWARDEN__PUSH_IDENTITY_URI}
      PUSH_INSTALLATION_ID_FILE: ${VAULTWARDEN__PUSH_INSTALLATION_ID_FILE}
      PUSH_INSTALLATION_KEY_FILE: ${VAULTWARDEN__PUSH_INSTALLATION_KEY_FILE}
      EXTENDED_LOGGING: ${VAULTWARDEN__EXTENDED_LOGGING}
      USE_SYSLOG: ${VAULTWARDEN__USE_SYSLOG}
      LOG_LEVEL: ${LOG_LEVEL}
      # No LOG_FILE: logs go to stdout only, where Docker rotates them (the file
      # it used to write was never rotated).
      DATABASE_URL_FILE: ${VAULTWARDEN__DATABASE_URL_FILE}
      SSO_ENABLED: ${VAULTWARDEN__SSO_ENABLED}
      SSO_AUTHORITY: ${VAULTWARDEN__SSO_AUTHORITY}
      SSO_SCOPES: ${VAULTWARDEN__SSO_SCOPES}
      SSO_CLIENT_ID_FILE: ${VAULTWARDEN__SSO_CLIENT_ID_FILE}
      SSO_CLIENT_SECRET_FILE: ${VAULTWARDEN__SSO_CLIENT_SECRET_FILE}
      SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION: ${VAULTWARDEN__SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION}
      SSO_SIGNUPS_MATCH_EMAIL: ${VAULTWARDEN__SSO_SIGNUPS_MATCH_EMAIL}
      SSO_CLIENT_CACHE_EXPIRATION: ${VAULTWARDEN__SSO_CLIENT_CACHE_EXPIRATION}

    networks:
    - external
    - db_postgres

    labels:
    - "traefik.enable=true"
    # No authelia@docker here on purpose: forward-auth breaks the Bitwarden apps/extensions.
    - "traefik.http.routers.${VAULTWARDEN__NAME}.rule=Host(`${VAULTWARDEN__SUBDOMAIN}.${DOMAINNAME}`)"
    - "traefik.http.routers.${VAULTWARDEN__NAME}.service=${VAULTWARDEN__NAME}"
    # The admin panel is never used by the apps, so it goes behind Authelia as well
    # as the admin token. The longer rule wins over the router above.
    - "traefik.http.routers.${VAULTWARDEN__NAME}-admin.rule=Host(`${VAULTWARDEN__SUBDOMAIN}.${DOMAINNAME}`) && PathRegexp(`^/+admin(/.*)?$$`)"
    - "traefik.http.routers.${VAULTWARDEN__NAME}-admin.middlewares=authelia@docker"
    - "traefik.http.routers.${VAULTWARDEN__NAME}-admin.service=${VAULTWARDEN__NAME}"
    - "traefik.http.services.${VAULTWARDEN__NAME}.loadbalancer.server.port=${VAULTWARDEN__PORT}"
    - "deunhealth.restart.on.unhealthy=true"

    volumes:
    - ${VOLDIR}/${VAULTWARDEN__NAME}:/data:rw
