services:
  freshrss:
    container_name: freshrss
    image: ${FRESHRSS__IMAGE}:${FRESHRSS__VERSION}
    restart: unless-stopped
    # FreshRSS can't read secret files, so load them into its env vars at start.
    # command is the image's CMD (overriding entrypoint discards it); re-check
    # after major upgrades: docker image inspect --format '{{json .Config.Cmd}}' <image>
    entrypoint:
    - /bin/sh
    - -c
    - >-
      OIDC_CLIENT_SECRET=$$(cat /run/secrets/freshrss_oidc_secret) &&
      OIDC_CLIENT_CRYPTO_KEY=$$(cat /run/secrets/freshrss_oidc_crypto_key) &&
      export OIDC_CLIENT_SECRET OIDC_CLIENT_CRYPTO_KEY &&
      exec "$$@"
    - --
    - ./Docker/entrypoint.sh
    command:
    - /bin/bash
    - -o
    - pipefail
    - -c
    - '([ -z "$$CRON_MIN" ] || cron) && . /etc/apache2/envvars && exec apache2 -D FOREGROUND $$([ -n "$$OIDC_ENABLED" ] && [ "$$OIDC_ENABLED" -ne 0 ] && echo "-D OIDC_ENABLED")'
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - SETGID   # apache/cron drop to www-data
    - SETUID
    # The entrypoint fixes ownership/permissions of ./data on every start
    # (chown -R / chmod -R). Without these, root can't read www-data's private
    # user dirs or change files it doesn't own, and logs "Permission denied".
    - CHOWN
    - DAC_READ_SEARCH
    - FOWNER
    #read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid
    depends_on:
      traefik:
        condition: service_started
        restart: false
      postgres:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    secrets:
    - freshrss_oidc_clientid
    - freshrss_oidc_secret
    - freshrss_pg_password
    - freshrss_oidc_crypto_key
    networks:
    - external
    - internal
    environment:
    - TZ=${TZ}
    - PUID=${PUID}
    - PGID=${PGID}
    - ADMIN_EMAIL=${EMAIL_ADMIN}
    - BASE_URL=https://rss.${DOMAINNAME}
    - SERVER_DNS=rss.${DOMAINNAME}
    - DB_TYPE=${POSTGRESQL__HOST}
    - DB_HOST=${POSTGRESQL__HOST}
    - DB_NAME=${FRESHRSS__DB_NAME}
    - DB_USER=${FRESHRSS__DB_USER}
    - DB_PASSWORD_FILE=${FRESHRSS__DB_PASSWORD_FILE}
    - CRON_MIN=${FRESHRSS__CRON_MIN}
    - TRUSTED_PROXY=${FRESHRSS__TRUSTED_PROXY}
    - OIDC_ENABLED=${FRESHRSS__OIDC_ENABLED}
    - OIDC_PROVIDER_METADATA_URL=${FRESHRSS__OIDC_PROVIDER_METADATA_URL}
    - OIDC_CLIENT_ID=${FRESHRSS__OIDC_CLIENT_ID}
    - OIDC_X_FORWARDED_HEADERS=${FRESHRSS__OIDC_X_FORWARDED_HEADERS}
    - OIDC_SCOPES=${FRESHRSS__OIDC_SCOPES}
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.freshrss.rule=Host(`rss.${DOMAINNAME}`)"
    - "traefik.http.routers.freshrss.middlewares=authelia@docker"
    - "traefik.http.services.freshrss.loadbalancer.server.port=80"
    - "deunhealth.restart.on.unhealthy=true"
    volumes:
    - ${VOLDIR}/fresh-rss/data:/var/www/FreshRSS/data:rw
    - ${VOLDIR}/fresh-rss/extensions:/var/www/FreshRSS/extensions:rw
    healthcheck:
      test: [ "CMD", "cli/health.php" ]
      timeout: 10s
      start_period: 60s
      start_interval: 11s
      interval: 75s
      retries: 3
