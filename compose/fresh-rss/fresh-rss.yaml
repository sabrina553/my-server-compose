## FreshRSS  https://github.com/FreshRSS/FreshRSS
## Feed reader at <subdomain>.<domain>, behind Authelia. Logs users in from
## Authelia's Remote-User header, which it accepts only from Traefik's fixed
## address (TRUSTED_PROXY). Its OIDC login is kept as a fallback
## (FRESHRSS__OIDC_ENABLED). Database in the shared Postgres.
services:
  freshrss:
    container_name: ${FRESHRSS__NAME}
    image: ${FRESHRSS__IMAGE}:${FRESHRSS__VERSION}
    restart: unless-stopped
    # FreshRSS can't read secret files, so load them into its env vars at start.
    # command is the image's CMD (overriding entrypoint discards it); re-check
    # after major upgrades:
    #   docker image inspect --format '{{json .Config.Entrypoint}} {{json .Config.Cmd}}' <image>
    entrypoint:
    - /bin/sh
    - -c
    - >-
      OIDC_CLIENT_ID=$$(cat /run/secrets/freshrss_oidc_client_id) &&
      OIDC_CLIENT_SECRET=$$(cat /run/secrets/freshrss_oidc_client_secret) &&
      OIDC_CLIENT_CRYPTO_KEY=$$(cat /run/secrets/freshrss_oidc_crypto_key) &&
      export OIDC_CLIENT_ID OIDC_CLIENT_SECRET OIDC_CLIENT_CRYPTO_KEY &&
      exec "$$@"
    - --
    - ./Docker/entrypoint.sh
    command:
    - /bin/bash
    - -o
    - pipefail
    - -c
    - '([ -z "$$CRON_MIN" ] || cron) && . /etc/apache2/envvars && exec apache2 -D FOREGROUND $$([ -n "$$OIDC_ENABLED" ] && [ "$$OIDC_ENABLED" -ne 0 ] && echo "-D OIDC_ENABLED")'

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - SETGID   # apache/cron drop to www-data
    - SETUID
    # The entrypoint fixes ownership/permissions of ./data on every start
    # (chown -R / chmod -R). Without these, root can't read www-data's private
    # user dirs or change files it doesn't own, and logs "Permission denied".
    - CHOWN
    - DAC_READ_SEARCH
    - FOWNER
    #read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      traefik:
        condition: service_started
        restart: false
      postgres:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    secrets:
    - freshrss_oidc_client_id
    - freshrss_oidc_client_secret
    - freshrss_db_password
    - freshrss_oidc_crypto_key
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      ADMIN_EMAIL: ${EMAIL_ADMIN}
      BASE_URL: https://${FRESHRSS__SUBDOMAIN}.${DOMAINNAME}
      SERVER_DNS: ${FRESHRSS__SUBDOMAIN}.${DOMAINNAME}
      DB_TYPE: ${POSTGRESQL__HOST}
      DB_HOST: ${POSTGRESQL__HOST}
      DB_NAME: ${FRESHRSS__DB_NAME}
      DB_USER: ${FRESHRSS__DB_USER}
      DB_PASSWORD_FILE: ${FRESHRSS__DB_PASSWORD_FILE}
      CRON_MIN: ${FRESHRSS__CRON_MIN}
      # Only Traefik (fixed IP in traefik.yaml) may set X-Forwarded-* and the
      # Remote-User header FreshRSS logs users in with.
      TRUSTED_PROXY: 172.20.0.249
      OIDC_ENABLED: ${FRESHRSS__OIDC_ENABLED}
      OIDC_PROVIDER_METADATA_URL: ${FRESHRSS__OIDC_PROVIDER_METADATA_URL}
      OIDC_X_FORWARDED_HEADERS: ${FRESHRSS__OIDC_X_FORWARDED_HEADERS}
      OIDC_SCOPES: ${FRESHRSS__OIDC_SCOPES}

    networks:
    - external
    - db_postgres

    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.${FRESHRSS__NAME}.rule=Host(`${FRESHRSS__SUBDOMAIN}.${DOMAINNAME}`)"
    - "traefik.http.routers.${FRESHRSS__NAME}.middlewares=authelia@docker"
    - "traefik.http.services.${FRESHRSS__NAME}.loadbalancer.server.port=80"
    - "deunhealth.restart.on.unhealthy=true"

    volumes:
    - ${FRESHRSS__VOLDIR}/data:/var/www/FreshRSS/data:rw
    - ${FRESHRSS__VOLDIR}/extensions:/var/www/FreshRSS/extensions:rw

    healthcheck:
      test: ["CMD", "cli/health.php"]
      interval: 75s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 11s
