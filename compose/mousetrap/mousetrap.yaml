## MouseTrap  https://github.com/sirjmann92/mousetrap
## Seedbox/tracker helper with a port monitor. Runs in the VPN's network
## namespace; web UI at <subdomain>.int.<domain> behind Authelia. Its UI and API
## have no login and listen on all addresses (hard-coded in start.sh), so only
## what shares a network with vpn can reach them (vpn is not on `external`).
## No Docker API access: its port monitor would only use it to list
## containers, read their IP via exec, and restart them, and the last two need
## write access nothing here gets. A port-monitor stack still works with a
## manual public IP (type the container name).
services:
  mousetrap:
    container_name: ${MOUSETRAP__NAME}
    image: ${MOUSETRAP__IMAGE}:${MOUSETRAP__VERSION}
    restart: unless-stopped

    security_opt:
    - no-new-privileges:true
    # Root-then-drop: start.sh rewrites appuser to PUID/PGID, chowns /config,
    # then su-execs. No read_only: start.sh writes /app/logconfig.yaml (and
    # /etc/passwd when PUID/PGID differ from the image's 1000).
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_READ_SEARCH
    - FOWNER
    - SETGID
    - SETUID
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      traefik:
        condition: service_started
        restart: false
      vpn:
        condition: service_healthy
        restart: true
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      # Must be upper case: it goes into a Python logging config verbatim, and
      # "info" (the shared LOG_LEVEL) crashes uvicorn at start-up.
      LOGLEVEL: ${MOUSETRAP__LOGLEVEL}
      # No DOCKER_HOST on purpose (see the header).

    network_mode: "service:vpn"

    labels:
    - "traefik.enable=true"
    # Network: set on vpn (traefik.docker.network=vpn_ui), not here.
    - "traefik.http.routers.${MOUSETRAP__NAME}.rule=Host(`${MOUSETRAP__SUBDOMAIN}.int.${DOMAINNAME}`)"
    - "traefik.http.routers.${MOUSETRAP__NAME}.middlewares=authelia@docker"
    - "traefik.http.services.${MOUSETRAP__NAME}.loadbalancer.server.port=39842"
    - "deunhealth.restart.on.unhealthy=true"

    volumes:
    - ${VOLDIR}/${MOUSETRAP__NAME}:/config:rw

    # Unhealthy when the VPN tunnel is gone from the shared network namespace
    # (Gluetun recreated, this container only restarted). Fix: recreate it.
    healthcheck:
      test: ["CMD-SHELL", "test -e /sys/class/net/tun0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
