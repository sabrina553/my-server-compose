## Immich  https://github.com/immich-app/immich
## Photos at <subdomain>.<domain>. No forward-auth (it breaks the mobile app's
## API calls): its own login with password login turned off, plus Authelia SSO
## (two_factor OIDC client). Database in the shared Postgres; Valkey (redis)
## and machine learning on the internal immich_backend network.
## Server and machine-learning versions must match (see .env.example).
services:
  immich-server:
    container_name: ${IMMICH__NAME}
    image: ${IMMICH__IMAGE}:${IMMICH__VERSION}
    restart: unless-stopped
    # Not root (the image's default; it ignores PUID/PGID).
    user: "${PUID}:${PGID}"

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    #read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      redis:
        condition: service_started
        restart: false
      traefik:
        condition: service_started
        restart: false
      postgres:
        condition: service_healthy
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    secrets:
    - immich_db_password
    environment:
      TZ: ${TZ}
      UPLOAD_LOCATION: ${IMMICH__UPLOAD_LOCATION}
      DB_HOSTNAME: ${POSTGRESQL__HOST}
      DB_PORT: ${POSTGRESQL__PORT}
      DB_USERNAME: ${IMMICH__DB_USERNAME}
      DB_DATABASE_NAME: ${IMMICH__DB_DATABASE_NAME}
      DB_PASSWORD_FILE: ${IMMICH__DB_PASSWORD_FILE}

    networks:
    - external
    - db_postgres
    - immich_backend
    devices:
    # Hardware transcoding (Immich is set to VAAPI). This VM has no renderD128,
    # so it can't work yet and Immich falls back to software. If a GPU is passed
    # through, also add `group_add: ["<host render gid>"]`: as PUID it can only
    # open the device through that group.
    - "/dev/dri:/dev/dri"

    labels:
    - "traefik.enable=true"
    # No authelia@docker: forward-auth breaks the mobile app's API calls.
    - "traefik.http.routers.${IMMICH__NAME}.rule=Host(`${IMMICH__SUBDOMAIN}.${DOMAINNAME}`)"
    - "traefik.http.services.${IMMICH__NAME}.loadbalancer.server.port=2283"
    - "deunhealth.restart.on.unhealthy=true"

    volumes:
    - ${IMMICH__UPLOAD_LOCATION}:/data
    - /etc/localtime:/etc/localtime:ro

  immich-machine-learning:
    container_name: ${IMMICH_ML__NAME}
    image: ${IMMICH_ML__IMAGE}:${IMMICH_ML__VERSION}
    restart: unless-stopped
    # Not root (the image's default): it writes only its model cache.
    user: "${PUID}:${PGID}"

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    #read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid

    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    networks:
    - immich_backend

    labels:
    - "deunhealth.restart.on.unhealthy=true"
    # Diun: only report -openvino releases
    - 'diun.include_tags=^v\d+\.\d+\.\d+-openvino$$'

    volumes:
    - ${IMMICH_ML__CACHE_DIR}:/cache:rw
