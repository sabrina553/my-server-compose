services:
  couchserver:
    container_name: couchdb
    image: ${COUCHDB__IMAGE}:${COUCHDB__VERSION}
    restart: always
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:   # entrypoint chowns data/config to couchdb, then drops to it
    - CHOWN
    - DAC_READ_SEARCH
    - FOWNER
    - SETGID
    - SETUID
    tmpfs:
    - /tmp:rw,noexec,nosuid
    depends_on:
      traefik:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    networks:
    - proxy_internal
    labels:
    - "traefik.enable=true"
    - "traefik.docker.network=proxy_internal"
    - "traefik.http.routers.couchserver.rule=Host(`couch.$DOMAINNAME`)"
    # No authelia@docker on the API: sync clients (e.g. Obsidian LiveSync) can't do
    # forward-auth. The API relies on CouchDB's own auth, so the admin must have a
    # strong password and [chttpd] require_valid_user = true in the mounted config.
    - "traefik.http.routers.couchserver.service=couchserver"
    # Fauxton (the web admin UI) is browser-only, so it also goes behind Authelia.
    # The longer rule wins over the router above.
    - "traefik.http.routers.couchserver-utils.rule=Host(`couch.$DOMAINNAME`) && PathPrefix(`/_utils`)"
    - "traefik.http.routers.couchserver-utils.middlewares=authelia@docker"
    - "traefik.http.routers.couchserver-utils.service=couchserver"
    # Password login (POST /_session, used by Fauxton) also goes behind Authelia.
    # Sync clients authenticate with JWT bearer tokens and never POST here; Basic
    # auth is disabled in CouchDB's config, so this is the only password path left.
    - "traefik.http.routers.couchserver-session.rule=Host(`couch.$DOMAINNAME`) && Path(`/_session`) && Method(`POST`)"
    - "traefik.http.routers.couchserver-session.middlewares=authelia@docker"
    - "traefik.http.routers.couchserver-session.service=couchserver"
    - "traefik.http.services.couchserver.loadbalancer.server.port=5984"
    - "deunhealth.restart.on.unhealthy=true"
    volumes:
    - ${VOLDIR}/couch/dbdata:/opt/couchdb/data
    - ${VOLDIR}/couch/config:/opt/couchdb/etc
