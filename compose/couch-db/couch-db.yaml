## CouchDB  https://github.com/apache/couchdb
## Sync backend for Obsidian LiveSync, at <subdomain>.<domain>. The sync API has
## no forward-auth (clients can't do it) and accepts only JWT bearer tokens;
## Basic auth and password login over the API are disabled in CouchDB's config.
## Fauxton (/_utils) and password login (POST /_session) sit behind Authelia.
## No internet access (proxy_internal).
services:
  couchserver:
    container_name: ${COUCHDB__NAME}
    image: ${COUCHDB__IMAGE}:${COUCHDB__VERSION}
    restart: unless-stopped

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:   # entrypoint chowns data/config to couchdb, then drops to it
    - CHOWN
    - DAC_READ_SEARCH
    - FOWNER
    - SETGID
    - SETUID
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      traefik:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}

    networks:
    - proxy_internal

    labels:
    - "traefik.enable=true"
    - "traefik.docker.network=proxy_internal"
    # The sync API: no authelia@docker (LiveSync can't do forward-auth). CouchDB
    # itself accepts only JWT here; see the header above.
    - "traefik.http.routers.${COUCHDB__NAME}.rule=Host(`${COUCHDB__SUBDOMAIN}.${DOMAINNAME}`)"
    - "traefik.http.routers.${COUCHDB__NAME}.service=${COUCHDB__NAME}"
    # Fauxton (the web admin UI) is browser-only, so it goes behind Authelia.
    # The longer rule wins over the router above.
    - "traefik.http.routers.${COUCHDB__NAME}-utils.rule=Host(`${COUCHDB__SUBDOMAIN}.${DOMAINNAME}`) && PathPrefix(`/_utils`)"
    - "traefik.http.routers.${COUCHDB__NAME}-utils.middlewares=authelia@docker"
    - "traefik.http.routers.${COUCHDB__NAME}-utils.service=${COUCHDB__NAME}"
    # Password login (POST /_session, used by Fauxton) also goes behind Authelia.
    # Sync clients authenticate with JWT bearer tokens and never POST here.
    - "traefik.http.routers.${COUCHDB__NAME}-session.rule=Host(`${COUCHDB__SUBDOMAIN}.${DOMAINNAME}`) && Path(`/_session`) && Method(`POST`)"
    - "traefik.http.routers.${COUCHDB__NAME}-session.middlewares=authelia@docker"
    - "traefik.http.routers.${COUCHDB__NAME}-session.service=${COUCHDB__NAME}"
    - "traefik.http.services.${COUCHDB__NAME}.loadbalancer.server.port=5984"
    - "deunhealth.restart.on.unhealthy=true"

    volumes:
    - ${COUCHDB__VOLDIR}/dbdata:/opt/couchdb/data
    - ${COUCHDB__VOLDIR}/config:/opt/couchdb/etc
