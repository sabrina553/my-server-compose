services:
  traefik:
    container_name: traefik
    image: ${TRAEFIK__IMAGE}:${TRAEFIK__VERSION}
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid
    depends_on:
      socket-proxy-ro:
        condition: service_healthy
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    secrets:
    - cf_dns_api_token
    environment:
    - TZ=${TZ}
    - CF_DNS_API_TOKEN_FILE=${TRAEFIK__CF_DNS_API_TOKEN_FILE}
    - LOG_LEVEL=${LOG_LEVEL}
    ports:
    - 80:80
    - 443:443
    networks:
      external:
        # Fixed so backends can trust X-Forwarded-* from Traefik only
        # (FreshRSS TRUSTED_PROXY, Home Assistant trusted_proxies).
        ipv4_address: 172.20.0.249
      proxy_internal:
        # Fixed: pgAdmin trusts the Remote-User header only from this address
        # (WEBSERVER_TRUSTED_PROXIES in compose/pg-admin/config_local.py).
        ipv4_address: 172.21.7.249
      filebrowser_proxy:
      arr:
      socket_proxy_ro:
    command:
    #API + Dash
    #Dashboard only via the traefik.int router below (behind Authelia), not on :8080.
    - "--api.insecure=false"
    - "--api.dashboard=true"
    #Observability 
    - "--log.level=INFO"
    - "--ping=true"
    - "--serversTransport.insecureSkipVerify=true"
    #EntryPoints :80
    - "--entryPoints.web.address=:80"
    - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
    - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
    - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
    #EntryPoints :443
    - "--entryPoints.websecure.address=:443"
    - "--entryPoints.websecure.http.tls=true"
    - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
    - "--entryPoints.websecure.http3=true"
    #EntryPoints :domain
    - "--entryPoints.websecure.http.tls.domains[0].main=${DOMAINNAME}"
    - "--entryPoints.websecure.http.tls.domains[0].sans=*.${DOMAINNAME},*.int.${DOMAINNAME}"
    - "--entryPoints.websecure.http.tls.domains[1].main=${DOMAINNAME2}"
    - "--entryPoints.websecure.http.tls.domains[1].sans=*.${DOMAINNAME2}"
    #Forwarded headers: trust X-Forwarded-For ONLY from cloudflared (fixed IP in
    #cloudflared.yaml), so Authelia sees the real visitor IP for tunnel traffic
    #instead of cloudflared's Docker IP. Everyone else's X-Forwarded-For is discarded.
    - "--entryPoints.web.forwardedHeaders.trustedIPs=172.20.0.250"
    - "--entryPoints.websecure.forwardedHeaders.trustedIPs=172.20.0.250"
    #Strip headers that alias another (Remote_User / Remote.User for Remote-User).
    #PHP backends (FreshRSS, Leantime) read them as the Remote-User header that
    #Authelia's forwardAuth sets, so a client could spoof the logged-in user.
    - "--entryPoints.web.http.aliasHeadersStrategy=delete"
    - "--entryPoints.websecure.http.aliasHeadersStrategy=delete"
    #Security headers on every HTTPS response (middleware defined in labels below).
    - "--entryPoints.websecure.http.middlewares=secure-headers@docker"
    #providers
    - "--providers.docker=true"
    - "--providers.docker.endpoint=${DOCKER_HOST_RO:-tcp://socket-proxy-ro:2375}"
    - "--providers.docker.exposedbydefault=false"
    #Containers sit on several networks; route over external unless a service
    #says otherwise with the traefik.docker.network label (see proxy_internal).
    - "--providers.docker.network=external"
    #certs 
    - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
    - "--certificatesresolvers.letsencrypt.acme.dnschallenge.propagation.delayBeforeChecks=10"
    - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
    - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=8.8.8.8:53"
    - "--certificatesresolvers.letsencrypt.acme.email=hosting@${DOMAINNAME}"
    - "--certificatesresolvers.letsencrypt.acme.storage=/etc/traefik/acme.json"
    labels:
    # Enable self‑routing
    - traefik.enable=true
    - traefik.http.routers.api.rule=Host(`traefik.int.${DOMAINNAME}`)
    - traefik.http.routers.api.middlewares=authelia@docker
    - traefik.http.routers.api.service=api@internal
    # Security headers, applied to every router on websecure (see command above).
    # HSTS is sticky: browsers will refuse plain HTTP on these domains and all
    # their subdomains for a year after seeing it.
    - traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000
    - traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true
    - traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true
    - traefik.http.middlewares.secure-headers.headers.referrerPolicy=strict-origin-when-cross-origin
    - traefik.http.middlewares.secure-headers.headers.customFrameOptionsValue=SAMEORIGIN
    - traefik.http.services.api.loadbalancer.server.port=8080
    - "deunhealth.restart.on.unhealthy=true"
    volumes:
    - ${VOLDIR}/traefik:/etc/traefik:rw
    healthcheck:
      test: wget --quiet --tries=1 --spider http://127.0.0.1:8080/ping || exit 1
      interval: 5s
      timeout: 1s
      retries: 3
      start_period: 10s
