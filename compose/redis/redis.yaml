services:
  redis:
    container_name: redis
    image: ${REDIS__IMAGE}:${REDIS__VERSION}
    restart: always
    security_opt:
      - no-new-privileges:true
      - apparmor:unconfined
    cap_drop:
      - ALL
    cap_add:
      #- chown
      - SETGID
      - SETUID
    #read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"
    networks:
      - internal
    labels:
      - "traefik.enable=false"
      - "deunhealth.restart.on.unhealthy=true"
      
    volumes:
      - ${VOLDIR}/redis:/data
    healthcheck:
      test: redis-cli ping || exit 1