## AdGuard Home  https://github.com/AdguardTeam/AdGuardHome
## LAN DNS server with filtering. DNS (53, TCP and UDP) is published on
## TRAEFIK__BIND_IP only; the admin UI is at <subdomain>.int.<domain> behind
## Authelia (admin group) and has its own login too. DNS only, no DHCP (see
## docs/decisions.md). Upstreams (DoH) and IPv4-only bootstrap are set in the UI.
services:
  adguard:
    container_name: ${ADGUARD__NAME}
    image: ${ADGUARD__IMAGE}:${ADGUARD__VERSION}
    restart: unless-stopped
    # Non-root, but only after the first run: AdGuard refuses a first launch
    # (no AdGuardHome.yaml yet) as non-root, so that one is done as root once.
    user: "${PUID}:${PGID}"

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    # The binary has the file capability cap_net_bind_service+eip (port 53 as
    # non-root); without it in the bounding set, exec fails with "operation
    # not permitted".
    cap_add:
    - NET_BIND_SERVICE
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      traefik:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    networks:
    - external

    ports:
    - ${TRAEFIK__BIND_IP}:53:53/tcp
    - ${TRAEFIK__BIND_IP}:53:53/udp

    labels:
    - "traefik.enable=true"
    - "traefik.docker.network=external"
    - "traefik.http.routers.${ADGUARD__NAME}.rule=Host(`${ADGUARD__SUBDOMAIN}.int.${DOMAINNAME}`)"
    - "traefik.http.routers.${ADGUARD__NAME}.middlewares=authelia@docker"
    - "traefik.http.services.${ADGUARD__NAME}.loadbalancer.server.port=${ADGUARD__PORT}"
    - "deunhealth.restart.on.unhealthy=true"

    volumes:
    # Config (AdGuardHome.yaml) and work dir (query log, stats, filters).
    # Owned by PUID:PGID (folders Docker creates itself are root's).
    - ${VOLDIR}/${ADGUARD__NAME}/conf:/opt/adguardhome/conf:rw
    - ${VOLDIR}/${ADGUARD__NAME}/work:/opt/adguardhome/work:rw

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:${ADGUARD__PORT}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
