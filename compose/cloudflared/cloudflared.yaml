## cloudflared  https://github.com/cloudflare/cloudflared
## Cloudflare Tunnel: the only way in from the internet. Forwards to Traefik;
## publishes no ports. Its fixed IP is the only source Traefik trusts for
## X-Forwarded-For.
services:
  tunnel:
    container_name: ${CLOUDFLARED__NAME}
    image: ${CLOUDFLARED__IMAGE}:${CLOUDFLARED__VERSION}
    restart: unless-stopped
    # Metrics on localhost only, for the healthcheck (`tunnel ready`).
    command: tunnel --no-autoupdate --protocol http2 --metrics 127.0.0.1:2000 run

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid

    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    secrets:
    - cloudflared_tunnel_token
    environment:
      TUNNEL_TOKEN_FILE: ${CLOUDFLARED__TUNNEL_TOKEN_FILE}

    networks:
      external:
        # Fixed so Traefik can trust X-Forwarded-For from this container only
        # (see forwardedHeaders.trustedIPs in traefik.yaml).
        ipv4_address: 172.20.0.250
    dns:
    - 1.1.1.1
    - 1.0.0.1

    labels:
    - "traefik.enable=false"
    - "deunhealth.restart.on.unhealthy=true"

    healthcheck:
      # No shell in the image; exits non-zero until a connection to Cloudflare is up.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
