## Dozzle  https://github.com/amir20/dozzle
## Live container logs in the browser, at <subdomain>.int.<domain> behind
## Authelia. Reads the Docker API through the read-only socket proxy; no
## internet access (proxy_internal).
services:
  dozzle:
    container_name: ${DOZZLE__NAME}
    image: ${DOZZLE__IMAGE}:${DOZZLE__VERSION}
    restart: unless-stopped

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      socket-proxy-ro:
        condition: service_healthy
        restart: false
      traefik:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    environment:
      DOCKER_HOST: ${DOCKER_HOST_RO:-tcp://socket-proxy-ro:2375}
      #DOZZLE_HOSTNAME: "${DOMAINNAME}"
      #DOZZLE_AUTH_PROVIDER: forward-proxy

    networks:
    - proxy_internal
    - socket_proxy_ro

    labels:
    - "traefik.enable=true"
    - "traefik.docker.network=proxy_internal"
    - "traefik.http.routers.${DOZZLE__NAME}.rule=Host(`${DOZZLE__SUBDOMAIN}.int.${DOMAINNAME}`)"
    - "traefik.http.routers.${DOZZLE__NAME}.middlewares=authelia@docker"
    - "traefik.http.services.${DOZZLE__NAME}.loadbalancer.server.port=8080"
    - "deunhealth.restart.on.unhealthy=true"
    # socket-proxy-ro allowlist: exactly the calls Dozzle was seen making.
    # Single quotes: `\.` is a parse error in double-quoted YAML.
    - 'socket-proxy.allow.head=/_ping'
    - 'socket-proxy.allow.get=/v1\.[0-9]+/(version|info|events|containers/json|containers/[0-9a-f]{12,64}/(json|logs|stats))(\?.*)?'

    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
