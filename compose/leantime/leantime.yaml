services:
  leantime_db:
    image: mysql:8.4
    container_name: leantime-mysql
    volumes:
    - ${LEAN__VOLUME_DIRECTORY}/db_data:/var/lib/mysql
    restart: unless-stopped
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - MYSQL_ROOT_PASSWORD=${LEAN__MYSQL_ROOT_PASSWORD}
    - MYSQL_DATABASE=${LEAN__MYSQL_DATABASE}
    - MYSQL_USER=${LEAN__MYSQL_USER}
    - MYSQL_PASSWORD=${LEAN__MYSQL_PASSWORD}
    networks:
    - internal
    command: --character-set-server=UTF8MB4 --collation-server=UTF8MB4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 30s
      timeout: 10s
      retries: 3

  #https://github.com/Leantime/leantime/tree/master
  leantime:
    container_name: ${LEAN__NAME}
    image: ${LEAN__IMAGE}:${LEAN__VERSION}
    restart: unless-stopped
    # Add security options
    security_opt:
    - no-new-privileges:true
    # Add capabilities
    cap_add:
    # - CAP_NET_BIND_SERVICE
    - CAP_CHOWN
    - CAP_SETGID
    - CAP_SETUID
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - LOG_LEVEL=DEBUG
    - LEAN_PORT=${LEAN__PORT}
    - LEAN_APP_URL=${LEAN__APP_URL}
    - LEAN_APP_DIR=${LEAN__APP_DIR}
    - LEAN_DEBUG=${LEAN__DEBUG}
    - VOLUME_DIRECTORY=${LEAN__VOLUME_DIRECTORY}
    # Database - MySQL container
    - LEAN_MYSQL_ROOT_PASSWORD=${LEAN__MYSQL_ROOT_PASSWORD}
    - LEAN_MYSQL_DATABASE=${LEAN__MYSQL_DATABASE}
    - LEAN_MYSQL_USER=${LEAN__MYSQL_USER}
    - LEAN_MYSQL_PASSWORD=${LEAN__MYSQL_PASSWORD}
    # Database - leantime container
    - LEAN_DB_HOST=${LEAN__DB_HOST}
    - LEAN_DB_USER=${LEAN__DB_USER}
    - LEAN_DB_PASSWORD=${LEAN__DB_PASSWORD}
    - LEAN_DB_DATABASE=${LEAN__DB_DATABASE}
    - LEAN_DB_PORT=${LEAN__DB_PORT}
    # Session Management
    - LEAN_SESSION_PASSWORD=${LEAN__SESSION_PASSWORD}
    - LEAN_SESSION_EXPIRATION=${LEAN__SESSION_EXPIRATION}
    - LEAN_SESSION_SECURE=${LEAN__SESSION_SECURE}
    - LEAN_SITENAME=${LEAN__SITENAME}
    - LEAN_LANGUAGE=${LEAN__LANGUAGE}
    - LEAN_DEFAULT_TIMEZONE=${LEAN__DEFAULT_TIMEZONE}
    - LEAN_LOG_PATH=${LEAN__LOG_PATH}
    - LEAN_DISABLE_LOGIN_FORM=${LEAN__DISABLE_LOGIN_FORM}
    # Local File Uploads
    - LEAN_USER_FILE_PATH=${LEAN__USER_FILE_PATH}
    - LEAN_DB_BACKUP_PATH=${LEAN__DB_BACKUP_PATH}
    # Email
    - LEAN_EMAIL_RETURN=${LEAN__NAME}@${DOMAINNAME}
    - LEAN_EMAIL_USE_SMTP=true
    - LEAN_EMAIL_SMTP_HOSTS=${SMTP__HOST}
    - LEAN_EMAIL_SMTP_AUTH=true
    - LEAN_EMAIL_SMTP_USERNAME=${SMTP__USERNAME}
    - LEAN_EMAIL_SMTP_PASSWORD=${SMTP__PASSWORD}
    - LEAN_EMAIL_SMTP_AUTO_TLS=true
    - LEAN_EMAIL_SMTP_SECURE=TLS
    - LEAN_EMAIL_SMTP_SSLNOVERIFY=false
    - LEAN_EMAIL_SMTP_PORT=${SMTP__PORT}
    - LEAN_LDAP_DEFAULT_ROLE_KEY=20;
    ## OpenID Connect
    - LEAN_OIDC_ENABLE=true
    - LEAN_OIDC_CLIENT_ID=${LEAN__OIDC_CLIENT_ID}
    - LEAN_OIDC_CLIENT_SECRET=${LEAN__OIDC_CLIENT_SECRET}
    - LEAN_OIDC_PROVIDER_URL=${LEAN__OIDC_PROVIDER_URL}
    - LEAN_OIDC_CREATE_USER=${LEAN__OIDC_CREATE_USER}
    - LEAN_OIDC_DEFAULT_ROLE=${LEAN__OIDC_DEFAULT_ROLE}
    - LEAN_USE_REDIS=${LEAN__USE_REDIS}
    ## Rate limiting
    - LEAN_RATELIMIT_GENERAL=${LEAN__RATELIMIT_GENERAL}
    - LEAN_RATELIMIT_API=${LEAN__RATELIMIT_API}
    - LEAN_RATELIMIT_AUTH=${LEAN__RATELIMIT_AUTH}
    networks:
    - internal
    - external
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.${LEAN__NAME}-https.rule=Host(`lean.${DOMAINNAME}`)"
    - "traefik.http.routers.${LEAN__NAME}.middlewares=authelia@docker"
    - "traefik.http.services.${LEAN__NAME}.loadbalancer.server.port=${LEAN__PORT}"
    - "deunhealth.restart.on.unhealthy=true"
    volumes:
    - ${LEAN__VOLUME_DIRECTORY}/public_userfiles:/var/www/html/public/userfiles # Volume to store public files, logo etc
    - ${LEAN__VOLUME_DIRECTORY}/userfiles:/var/www/html/userfiles # Original volume name for compatibility
    - ${LEAN__VOLUME_DIRECTORY}/plugins:/var/www/html/app/Plugins # Plugin storage
    - ${LEAN__VOLUME_DIRECTORY}/logs:/var/www/html/storage/logs # Log storage
    depends_on:
      leantime_db:
        condition: service_healthy
