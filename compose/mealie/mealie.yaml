## Mealie  https://github.com/mealie-recipes/mealie
## Recipes at <subdomain>.<domain>, behind Authelia, with OIDC login that skips
## Mealie's own login page (MEALIE__OIDC_AUTO_REDIRECT). Local sign-up is off.
## Database in the shared Postgres.
services:
  mealie:
    container_name: ${MEALIE__NAME}
    image: ${MEALIE__IMAGE}:${MEALIE__VERSION}
    restart: always

    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:   # entrypoint drops to PUID/PGID
    - CHOWN
    - SETGID
    - SETUID
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid

    depends_on:
      traefik:
        condition: service_started
        restart: false
      postgres:
        condition: service_started
        restart: false
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "3"

    secrets:
    - smtp_password
    - mealie_oidc_clientid
    - mealie_oidc_secret
    - mealie_pg_password
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      LOG_LEVEL: ${LOG_LEVEL}
      BASE_URL: https://${MEALIE__SUBDOMAIN}.${DOMAINNAME}
      ALLOW_PASSWORD_LOGIN: ${MEALIE__ALLOW_PASSWORD_LOGIN}
      ALLOW_SIGNUP: ${MEALIE__ALLOW_SIGNUP}
      SMTP_FROM_NAME: ${MEALIE__SMTP_FROM_NAME}
      SMTP_FROM_EMAIL: ${MEALIE__SMTP_FROM_EMAIL}
      SMTP_HOST: ${SMTP__HOST}
      SMTP_PORT: ${SMTP__PORT}
      SMTP_USER: ${SMTP__USERNAME}
      SMTP_PASSWORD_FILE: ${SMTP__PASSWORD}
      SMTP_AUTH_STRATEGY: ${MEALIE__SMTP_AUTH_STRATEGY}
      DB_ENGINE: postgres
      POSTGRES_SERVER: ${POSTGRESQL__HOST}
      POSTGRES_PORT: ${POSTGRESQL__PORT}
      POSTGRES_USER: ${MEALIE__POSTGRES_USER}
      POSTGRES_DB: ${MEALIE__POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: ${MEALIE__POSTGRES_PASSWORD_FILE}
      OIDC_AUTH_ENABLED: ${MEALIE__OIDC_AUTH_ENABLED}
      OIDC_PROVIDER_NAME: ${MEALIE__OIDC_PROVIDER_NAME}
      OIDC_CONFIGURATION_URL: ${MEALIE__OIDC_CONFIGURATION_URL}
      OIDC_CLIENT_ID_FILE: ${MEALIE__OIDC_CLIENT_ID_FILE}
      OIDC_CLIENT_SECRET_FILE: ${MEALIE__OIDC_CLIENT_SECRET_FILE}
      OIDC_SIGNUP_ENABLED: ${MEALIE__OIDC_SIGNUP_ENABLED}
      OIDC_ADMIN_GROUP: ${MEALIE__OIDC_ADMIN_GROUP}
      OIDC_USER_GROUP: ${MEALIE__OIDC_USER_GROUP}
      OIDC_AUTO_REDIRECT: ${MEALIE__OIDC_AUTO_REDIRECT}
      OIDC_REMEMBER_ME: ${MEALIE__OIDC_REMEMBER_ME}
      THEME_LIGHT_PRIMARY: ${MEALIE__THEME_LIGHT_PRIMARY}
      THEME_LIGHT_ACCENT: ${MEALIE__THEME_LIGHT_ACCENT}
      THEME_LIGHT_SECONDARY: ${MEALIE__THEME_LIGHT_SECONDARY}
      THEME_LIGHT_SUCCESS: ${MEALIE__THEME_LIGHT_SUCCESS}
      THEME_LIGHT_INFO: ${MEALIE__THEME_LIGHT_INFO}
      THEME_LIGHT_WARNING: ${MEALIE__THEME_LIGHT_WARNING}
      THEME_LIGHT_ERROR: ${MEALIE__THEME_LIGHT_ERROR}
      THEME_DARK_PRIMARY: ${MEALIE__THEME_DARK_PRIMARY}
      THEME_DARK_ACCENT: ${MEALIE__THEME_DARK_ACCENT}
      THEME_DARK_SECONDARY: ${MEALIE__THEME_DARK_SECONDARY}
      THEME_DARK_SUCCESS: ${MEALIE__THEME_DARK_SUCCESS}
      THEME_DARK_INFO: ${MEALIE__THEME_DARK_INFO}
      THEME_DARK_WARNING: ${MEALIE__THEME_DARK_WARNING}
      THEME_DARK_ERROR: ${MEALIE__THEME_DARK_ERROR}

    networks:
    - external
    - db_postgres

    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.${MEALIE__NAME}.rule=Host(`${MEALIE__SUBDOMAIN}.${DOMAINNAME}`)"
    - "traefik.http.routers.${MEALIE__NAME}.middlewares=authelia@docker"
    - "traefik.http.services.${MEALIE__NAME}.loadbalancer.server.port=9000"
    - "deunhealth.restart.on.unhealthy=true"

    volumes:
    - ${VOLDIR}/${MEALIE__NAME}/:/app/data/:rw
